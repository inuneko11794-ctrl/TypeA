<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BATTLE BANK-KUN | PRO MATRIX EXECUTION</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-cyan: 0, 240, 255;
      --color-magenta: 255, 0, 128;
      --color-dark: 10, 15, 30;
    }
    body {
      background-color: #05050a;
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(var(--color-cyan), 0.08), transparent 30%),
        radial-gradient(circle at 85% 30%, rgba(var(--color-magenta), 0.08), transparent 30%),
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
      font-family: 'Rajdhani', sans-serif;
      color: #e2e8f0;
      overflow-x: hidden;
    }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    .font-mono-tech { font-family: 'Share Tech Mono', monospace; }
    
    .glass-panel {
      background: rgba(var(--color-dark), 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(var(--color-cyan), 0.2);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(var(--color-cyan), 0.05);
      position: relative;
      overflow: hidden;
    }
    .glass-panel::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(var(--color-cyan), 0.6), transparent);
    }
    
    .neon-text-cyan { text-shadow: 0 0 10px rgba(var(--color-cyan), 0.7); }
    .neon-text-magenta { text-shadow: 0 0 10px rgba(var(--color-magenta), 0.7); }
    
    .btn-cyber {
      background: rgba(var(--color-cyan), 0.1);
      border: 1px solid rgba(var(--color-cyan), 0.5);
      color: rgb(var(--color-cyan));
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .btn-cyber:hover {
      background: rgba(var(--color-cyan), 0.25);
      box-shadow: 0 0 15px rgba(var(--color-cyan), 0.4);
      transform: translateY(-1px);
    }
    .btn-cyber::after {
      content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
      background: linear-gradient(to bottom right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0) 100%);
      transform: rotate(45deg) translate(-100%, -100%);
      transition: all 0.5s ease;
    }
    .btn-cyber:hover::after { transform: rotate(45deg) translate(100%, 100%); }

    .btn-magenta {
      background: rgba(var(--color-magenta), 0.1);
      border: 1px solid rgba(var(--color-magenta), 0.5);
      color: #ff66a3;
    }
    .btn-magenta:hover {
      background: rgba(var(--color-magenta), 0.25);
      box-shadow: 0 0 15px rgba(var(--color-magenta), 0.4);
    }

    .card-matrix {
      transition: all 0.4s ease;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .card-matrix:hover {
      border-color: rgba(var(--color-cyan), 0.5);
      box-shadow: 0 10px 30px -10px rgba(var(--color-cyan), 0.4);
      transform: translateY(-4px);
    }
    
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
    ::-webkit-scrollbar-thumb { background: rgba(var(--color-cyan), 0.4); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(var(--color-cyan), 0.8); }
    
    .scanline {
      width: 100%; height: 100px;
      background: linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(var(--color-cyan), 0.1) 50%, rgba(0,0,0,0) 100%);
      opacity: 0.1;
      position: absolute; bottom: 100%;
      animation: scanline 8s linear infinite;
      pointer-events: none;
    }
    @keyframes scanline {
      0% { bottom: 100%; }
      100% { bottom: -100px; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-4 md:p-8">

  <!-- Main Container -->
  <div class="w-full max-w-7xl relative z-10">
    <div class="scanline"></div>
    
    <!-- Header -->
    <header class="flex flex-col md:flex-row justify-between items-end border-b border-[rgba(0,240,255,0.3)] pb-4 mb-8">
      <div>
        <h1 class="font-orbitron text-3xl md:text-4xl font-black tracking-widest text-white neon-text-cyan flex items-center gap-3">
          BATTLE BANK-KUN
          <span class="text-xs tracking-normal bg-cyan-900/50 border border-cyan-500 text-cyan-300 px-2 py-1 rounded">PRO MATRIX EXECUTION</span>
        </h1>
        <p class="text-gray-400 text-sm tracking-widest uppercase mt-2">v3.0.0 // Kinetic Visualization & Deep Data Parser</p>
      </div>
      <div id="dataCount" class="font-mono-tech text-lg text-cyan-400 border border-cyan-500/30 bg-cyan-950/30 px-4 py-1.5 rounded mt-4 md:mt-0 shadow-[0_0_10px_rgba(0,240,255,0.1)]">
        SYS.DB.COUNT: [ 0 ]
      </div>
    </header>

    <!-- Dashboard Grid -->
    <div class="grid grid-cols-1 xl:grid-cols-12 gap-8 mb-8">
      
      <!-- Control Terminal (Left Column) -->
      <div class="xl:col-span-4 flex flex-col gap-6">
        <div class="glass-panel p-5 rounded-xl">
          <div class="flex justify-between items-center mb-3">
            <h2 class="font-orbitron text-sm tracking-widest text-cyan-400 border-l-2 border-cyan-400 pl-2">DATA UPLINK</h2>
            <button onclick="document.getElementById('mdFileInput').click()" class="text-xs font-bold text-gray-300 hover:text-white transition flex items-center gap-1 bg-gray-800/50 px-2 py-1 rounded border border-gray-600 hover:border-cyan-400">
              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
              FILE LOAD
            </button>
            <input type="file" id="mdFileInput" class="hidden" accept=".md,.txt" onchange="loadMarkdown(event)">
          </div>
          
          <textarea id="dataInput" rows="7" class="w-full p-3 bg-black/50 border border-gray-700 rounded-lg text-gray-300 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 font-mono-tech text-xs placeholder-gray-600 resize-none transition" placeholder="> Awaiting raw race data or result text...&#10;> Paste content here to initiate parse sequence."></textarea>
          
          <div class="flex flex-col gap-3 mt-4">
            <button onclick="extractAndSaveData()" class="btn-cyber font-bold py-3 rounded-lg text-sm flex justify-center items-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
              EXTRACT & ARCHIVE
            </button>
            <button onclick="applyResults()" class="btn-cyber btn-magenta font-bold py-3 rounded-lg text-sm flex justify-center items-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
              SYNC PAYOUT RESULTS
            </button>
          </div>
        </div>

        <div class="glass-panel p-5 rounded-xl">
          <h2 class="font-orbitron text-sm tracking-widest text-cyan-400 border-l-2 border-cyan-400 pl-2 mb-4">SYSTEM COMMANDS</h2>
          <div class="grid grid-cols-2 gap-3 mb-4">
            <button onclick="showPayoutEditor()" class="bg-gray-800 hover:bg-gray-700 text-gray-200 border border-gray-600 font-bold py-2 rounded text-xs transition uppercase tracking-wider">Manual Edit</button>
            <button onclick="runAnalysis()" class="bg-gray-800 hover:bg-cyan-900 text-cyan-300 border border-cyan-800 font-bold py-2 rounded text-xs transition uppercase tracking-wider">Run Matrix</button>
          </div>
          <div class="grid grid-cols-3 gap-2 border-t border-gray-800 pt-4">
            <button onclick="exportData()" class="bg-black border border-gray-700 hover:border-gray-500 text-gray-400 py-1.5 rounded text-[10px] uppercase">Export</button>
            <button onclick="document.getElementById('fileInput').click()" class="bg-black border border-gray-700 hover:border-gray-500 text-gray-400 py-1.5 rounded text-[10px] uppercase">Import</button>
            <input type="file" id="fileInput" class="hidden" accept=".json" onchange="importData(event)">
            <button onclick="clearData()" class="bg-black border border-red-900/50 hover:border-red-600 text-red-500 py-1.5 rounded text-[10px] uppercase">Purge</button>
          </div>
        </div>
      </div>

      <!-- Main Visual Analytics (Right Column) -->
      <div class="xl:col-span-8 flex flex-col gap-6">
        
        <!-- Graph Area -->
        <div class="glass-panel p-5 rounded-xl flex-grow flex flex-col">
          <h2 class="font-orbitron text-sm tracking-widest text-white border-l-2 border-magenta-500 pl-2 mb-4 flex justify-between">
            <span class="neon-text-magenta">KINETIC VISUALIZER</span>
            <span class="text-xs text-gray-500 tracking-normal font-mono-tech">STATUS: ONLINE</span>
          </h2>
          <div class="flex-grow w-full bg-black/40 rounded-lg border border-gray-800/50 p-4 relative" style="min-height: 280px;">
            <canvas id="matrixChart"></canvas>
          </div>
        </div>

        <!-- Terminal Output -->
        <div class="glass-panel p-5 rounded-xl h-48 flex flex-col">
          <h2 class="font-orbitron text-xs tracking-widest text-gray-400 border-l-2 border-gray-600 pl-2 mb-2">TERMINAL LOG</h2>
          <div id="outputArea" class="flex-grow bg-black/60 rounded border border-gray-800 p-3 overflow-y-auto font-mono-tech text-xs text-cyan-500 leading-relaxed whitespace-pre-wrap">SYSTEM BOOT SEQUENCE INITIATED...
AWAITING COMMAND EXECUTION...</div>
        </div>
      </div>
    </div>

    <!-- Stats Cards Grid -->
    <h2 class="font-orbitron text-sm tracking-widest text-cyan-400 border-l-2 border-cyan-400 pl-2 mb-4">CATEGORY METRICS</h2>
    <div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-6 gap-4" id="categoryCards">
      <!-- Generated via JS -->
    </div>

  </div>

  <script>
    let savedRecords = [];
    let myChart = null;

    window.onload = () => {
      const stored = localStorage.getItem('battleBankProData');
      if (stored) {
        savedRecords = JSON.parse(stored);
        updateCountDisplay();
        runAnalysis();
        logToTerminal("System restored from local database.\nReady.");
      } else {
        runAnalysis(); 
      }
    };
    
    function logToTerminal(msg) {
        const out = document.getElementById('outputArea');
        const time = new Date().toLocaleTimeString('ja-JP', { hour12: false });
        out.innerText = `[${time}] ${msg}`;
    }

    function loadMarkdown(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('dataInput').value = e.target.result;
        document.getElementById('mdFileInput').value = ''; 
        logToTerminal("File injected into memory cache. Ready for extraction.");
      };
      reader.readAsText(file);
    }

    function extractAndSaveData() {
      const inputData = document.getElementById('dataInput').value;
      if (!inputData.trim()) {
        alert("NO DATA DETECTED IN BUFFER.");
        return;
      }

      let extractedCount = 0;
      let logText = "INITIATING PARSE SEQUENCE...\n";
      const blocks = inputData.split(/(?=競輪レースデータ|レース名|第?\d+R)/);
      
      blocks.forEach(block => {
          if(!block.trim()) return;
          
          let venue = "UNKNOWN";
          let raceName = "UNKNOWN";
          
          const raceMatch = block.match(/([^\s#]*?\d+R)/);
          if (raceMatch) {
              raceName = raceMatch[1];
              const venueClean = raceName.replace(/競輪レースデータ：/g, '').replace(/\d+R/g, '').trim();
              if (venueClean) venue = venueClean;
          }

          // Girls precision logic
          const hasGirlsKeyword = block.includes("ガールズ") || block.includes("L級");
          const comments = block.match(/- \*\*\[\d+\]\s*.*?\*\*：(.*?)(?=\n|$)/g);
          let tankiCount = 0;
          let totalCommentCount = 0;
          if (comments) {
              totalCommentCount = comments.length;
              comments.forEach(c => {
                  if (c.includes("単騎") || c.includes("自力") || c.includes("自在")) { 
                      if(c.includes("単騎")) tankiCount++; 
                  }
              });
          }

          let isGirls = false;
          if (hasGirlsKeyword && (totalCommentCount > 0 && tankiCount === totalCommentCount)) {
              isGirls = true;
          } else if (hasGirlsKeyword && totalCommentCount === 0) {
              isGirls = true;
          }

          let category = "9車";
          if (isGirls) {
              category = "ガールズ";
          } else {
              const allCarRows = block.match(/\| \d+ \|/g);
              if (allCarRows) {
                  const carCount = allCarRows.length;
                  if (carCount >= 5 && carCount <= 9) category = carCount + "車";
              } else {
                  const matchCars = block.match(/\[([\d\s]+)\]/g);
                  if (matchCars) {
                      let maxCarNum = 0;
                      matchCars.forEach(m => {
                          const nums = m.replace(/[\[\]]/g, '').trim().split(/\s+/).map(Number);
                          nums.forEach(n => { if(n > maxCarNum) maxCarNum = n; });
                      });
                      if (maxCarNum >= 5 && maxCarNum <= 9) category = maxCarNum + "車";
                  }
              }
          }

          let patternKey = null;
          let diffPatternKey = null;
          let diffDisplay = null;
          
          const allLineMatches = block.match(/\[([\d\s]+)\]/g);
          let allDiffs = [];
          let diffLogArr = [];
          
          if (allLineMatches) {
              allLineMatches.forEach((lm, index) => {
                  const carsArr = lm.replace(/[\[\]]/g, '').trim().split(/\s+/).map(Number);
                  if (index === 0 && carsArr.length > 1) {
                      patternKey = carsArr.join('-');
                  }
                  if (carsArr.length > 1) {
                      let localDiffs = [];
                      for (let i = 0; i < carsArr.length - 1; i++) {
                          localDiffs.push(Math.abs(carsArr[i] - carsArr[i+1]));
                      }
                      let sum = localDiffs.reduce((a, b) => a + b, 0);
                      if (sum === 4) {
                          allDiffs.push(4);
                          diffLogArr.push("4(合算)");
                      } else {
                          allDiffs.push(...localDiffs);
                          diffLogArr.push(localDiffs.join('-'));
                      }
                  }
              });
              
              if (allDiffs.length > 0) {
                  diffPatternKey = allDiffs.join('-');
                  diffDisplay = diffLogArr.join(' / ');
              }
          }
          
          if (patternKey || diffPatternKey) {
              const exists = savedRecords.find(r => r.raceName === raceName && r.pattern === patternKey);
              if (!exists) {
                  const record = { 
                      venue: venue,
                      raceName: raceName,
                      category: category,
                      pattern: patternKey, 
                      diffPattern: diffPatternKey, 
                      diffDisplay: diffDisplay,
                      payout: 0, 
                      timestamp: new Date().getTime() 
                  };
                  savedRecords.push(record);
                  extractedCount++;
                  logText += `> [${category}] ${venue} / ${raceName} >> LOGGED\n`;
              }
          }
      });

      if (extractedCount > 0) {
        localStorage.setItem('battleBankProData', JSON.stringify(savedRecords));
        document.getElementById('dataInput').value = '';
        updateCountDisplay();
        runAnalysis();
        logToTerminal(logText + `\n>> SUCCESS: ${extractedCount} races archived into Matrix.`);
      } else {
        logToTerminal(">> WARNING: No valid format data found in buffer.");
      }
    }

    function applyResults() {
        const text = document.getElementById('dataInput').value;
        if (!text.trim()) {
            alert("NO PAYOUT DATA DETECTED IN BUFFER.");
            return;
        }

        let updatedCount = 0;
        let logText = "INITIATING PAYOUT SYNC...\n";

        savedRecords.forEach(record => {
            if (record.raceName && record.payout === 0) {
                const raceIdx = text.indexOf(record.raceName);
                if (raceIdx !== -1) {
                    const searchArea = text.substring(raceIdx, raceIdx + 300);
                    const payoutMatch = searchArea.match(/3連単.*?(\d{1,3}(?:,\d{3})*|\d+)\s*円/);
                    if (payoutMatch) {
                        const money = parseInt(payoutMatch[1].replace(/,/g, ''), 10);
                        if (money > 0) {
                            record.payout = money;
                            updatedCount++;
                            logText += `> ${record.raceName} >> JPY ${money.toLocaleString()}\n`;
                        }
                    } else {
                        const genericMatch = searchArea.match(/配当.*?(\d{1,3}(?:,\d{3})*|\d+)円/);
                        if (genericMatch) {
                            record.payout = parseInt(genericMatch[1].replace(/,/g, ''), 10);
                            updatedCount++;
                            logText += `> ${record.raceName} >> JPY ${record.payout.toLocaleString()} (GENERIC)\n`;
                        }
                    }
                }
            }
        });

        if (updatedCount > 0) {
            localStorage.setItem('battleBankProData', JSON.stringify(savedRecords));
            document.getElementById('dataInput').value = '';
            updateCountDisplay();
            runAnalysis();
            logToTerminal(logText + `\n>> SYNC COMPLETE: ${updatedCount} records updated.`);
        } else {
            logToTerminal(">> WARNING: No matching empty records found for sync.");
        }
    }

    function runAnalysis() {
      const categories = ["5車", "6車", "7車", "8車", "9車", "ガールズ"];
      const catStats = {};
      categories.forEach(c => { catStats[c] = { count: 0, payouts: [] }; });

      if (savedRecords.length > 0) {
          savedRecords.forEach(record => {
            let cat = record.category || "9車";
            if (!catStats[cat]) catStats[cat] = { count: 0, payouts: [] };
            catStats[cat].count++;
            if (record.payout > 0) catStats[cat].payouts.push(record.payout);
          });
      }
let cardsHtml = '';
      let chartLabels = categories;
      let chartCounts = [];
      let chartAvgs = [];

      categories.forEach(c => {
        const data = catStats[c];
        const avg = data.payouts.length > 0 ? Math.round(data.payouts.reduce((a,b)=>a+b,0)/data.payouts.length) : 0;
        const max = data.payouts.length > 0 ? Math.max(...data.payouts) : 0;
        
        chartCounts.push(data.count);
        chartAvgs.push(avg);

        // Pro Card Design
        cardsHtml += `
          <div class="card-matrix bg-black/60 backdrop-blur-sm p-4 rounded-xl flex flex-col justify-between relative overflow-hidden group">
            <div class="absolute top-0 right-0 w-24 h-24 bg-gradient-to-br from-[rgba(0,240,255,0.05)] to-transparent rounded-bl-full pointer-events-none group-hover:from-[rgba(0,240,255,0.15)] transition"></div>
            
            <div class="mb-4">
              <div class="font-orbitron text-[11px] text-gray-500 tracking-widest mb-1 uppercase">Target Group</div>
              <div class="font-bold text-lg text-white group-hover:neon-text-cyan transition">${c}</div>
            </div>
            
            <div class="grid grid-cols-2 gap-2 mb-3">
              <div class="bg-gray-900/80 border border-gray-800 rounded p-2 text-center">
                <div class="text-[9px] text-gray-500 uppercase tracking-widest">Logged</div>
                <div class="font-mono-tech text-cyan-400 text-sm">${data.count}</div>
              </div>
              <div class="bg-gray-900/80 border border-gray-800 rounded p-2 text-center">
                <div class="text-[9px] text-gray-500 uppercase tracking-widest">Synced</div>
                <div class="font-mono-tech text-magenta-400 text-sm">${data.payouts.length}</div>
              </div>
            </div>
            
            <div class="mt-2 pt-2 border-t border-gray-800">
              <div class="text-[9px] text-gray-500 uppercase tracking-widest mb-1 flex justify-between">
                <span>Avg Return</span>
                <span>Max</span>
              </div>
              <div class="flex justify-between items-end">
                <div class="font-mono-tech font-bold text-lg text-white">${avg > 0 ? '¥' + avg.toLocaleString() : '---'}</div>
                <div class="font-mono-tech text-[10px] text-gray-400">${max > 0 ? '¥' + max.toLocaleString() : '-'}</div>
              </div>
            </div>
          </div>
        `;
      });

      document.getElementById('categoryCards').innerHTML = cardsHtml;

      // Draw Advanced Chart
      const canvas = document.getElementById('matrixChart');
      const ctx = canvas.getContext('2d');
      
      // Gradients
      const barGrad = ctx.createLinearGradient(0, 0, 0, 300);
      barGrad.addColorStop(0, 'rgba(0, 240, 255, 0.6)');
      barGrad.addColorStop(1, 'rgba(0, 240, 255, 0.05)');
      
      const lineGrad = ctx.createLinearGradient(0, 0, 0, 300);
      lineGrad.addColorStop(0, 'rgba(255, 0, 128, 0.3)');
      lineGrad.addColorStop(1, 'rgba(255, 0, 128, 0.0)');

      if (myChart) myChart.destroy();

      myChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: chartLabels,
          datasets: [
            {
              label: ' LOGGED RACES',
              data: chartCounts,
              backgroundColor: barGrad,
              borderColor: 'rgba(0, 240, 255, 1)',
              borderWidth: 1.5,
              yAxisID: 'y',
              borderRadius: 2,
              barPercentage: 0.5,
              order: 2
            },
            {
              label: ' AVG RETURN (JPY)',
              data: chartAvgs,
              type: 'line',
              borderColor: 'rgba(255, 0, 128, 1)',
              backgroundColor: lineGrad,
              borderWidth: 2.5,
              fill: true,
              pointBackgroundColor: '#05050a',
              pointBorderColor: 'rgba(255, 0, 128, 1)',
              pointBorderWidth: 2,
              pointRadius: 4,
              pointHoverRadius: 6,
              pointHoverBackgroundColor: 'rgba(255, 0, 128, 1)',
              pointHoverBorderColor: '#fff',
              yAxisID: 'y1',
              tension: 0.4,
              order: 1
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          scales: {
            x: {
              grid: { color: 'rgba(255, 255, 255, 0.03)', drawBorder: false },
              ticks: { color: '#64748b', font: { family: "'Share Tech Mono', monospace", size: 11 } }
            },
            y: {
              type: 'linear', position: 'left',
              grid: { color: 'rgba(255, 255, 255, 0.03)', drawBorder: false },
              ticks: { color: 'rgba(0, 240, 255, 0.8)', font: { family: "'Share Tech Mono', monospace", size: 11 } }
            },
            y1: {
              type: 'linear', position: 'right',
              grid: { display: false },
              ticks: { color: 'rgba(255, 0, 128, 0.8)', font: { family: "'Share Tech Mono', monospace", size: 11 } }
            }
          },
          plugins: {
            legend: {
              position: 'top',
              align: 'end',
              labels: {
                color: '#94a3b8',
                font: { family: "'Rajdhani', sans-serif", size: 12, weight: '600' },
                boxWidth: 12, boxHeight: 12, usePointStyle: true
              }
            },
            tooltip: {
              backgroundColor: 'rgba(10, 15, 30, 0.9)',
              titleColor: '#fff',
              titleFont: { family: "'Orbitron', sans-serif" },
              bodyColor: '#e2e8f0',
              bodyFont: { family: "'Share Tech Mono', monospace" },
              borderColor: 'rgba(0, 240, 255, 0.3)',
              borderWidth: 1,
              padding: 10,
              displayColors: true,
              callbacks: {
                  label: function(context) {
                      let label = context.dataset.label || '';
                      if (label) { label += ': '; }
                      if (context.datasetIndex === 1) {
                          label += '¥' + context.parsed.y.toLocaleString();
                      } else {
                          label += context.parsed.y;
                      }
                      return label;
                  }
              }
            }
          }
        }
      });
    }

    let cardsHtml = '';
      let chartLabels = categories;
      let chartCounts = [];
      let chartAvgs = [];

      categories.forEach(c => {
        const data = catStats[c];
        const avg = data.payouts.length > 0 ? Math.round(data.payouts.reduce((a,b)=>a+b,0)/data.payouts.length) : 0;
        const max = data.payouts.length > 0 ? Math.max(...data.payouts) : 0;
        
        chartCounts.push(data.count);
        chartAvgs.push(avg);

        // Pro Card Design
        cardsHtml += `
          <div class="card-matrix bg-black/60 backdrop-blur-sm p-4 rounded-xl flex flex-col justify-between relative overflow-hidden group">
            <div class="absolute top-0 right-0 w-24 h-24 bg-gradient-to-br from-[rgba(0,240,255,0.05)] to-transparent rounded-bl-full pointer-events-none group-hover:from-[rgba(0,240,255,0.15)] transition"></div>
            
            <div class="mb-4">
              <div class="font-orbitron text-[11px] text-gray-500 tracking-widest mb-1 uppercase">Target Group</div>
              <div class="font-bold text-lg text-white group-hover:neon-text-cyan transition">${c}</div>
            </div>
            
            <div class="grid grid-cols-2 gap-2 mb-3">
              <div class="bg-gray-900/80 border border-gray-800 rounded p-2 text-center">
                <div class="text-[9px] text-gray-500 uppercase tracking-widest">Logged</div>
                <div class="font-mono-tech text-cyan-400 text-sm">${data.count}</div>
              </div>
              <div class="bg-gray-900/80 border border-gray-800 rounded p-2 text-center">
                <div class="text-[9px] text-gray-500 uppercase tracking-widest">Synced</div>
                <div class="font-mono-tech text-magenta-400 text-sm">${data.payouts.length}</div>
              </div>
            </div>
            
            <div class="mt-2 pt-2 border-t border-gray-800">
              <div class="text-[9px] text-gray-500 uppercase tracking-widest mb-1 flex justify-between">
                <span>Avg Return</span>
                <span>Max</span>
              </div>
              <div class="flex justify-between items-end">
                <div class="font-mono-tech font-bold text-lg text-white">${avg > 0 ? '¥' + avg.toLocaleString() : '---'}</div>
                <div class="font-mono-tech text-[10px] text-gray-400">${max > 0 ? '¥' + max.toLocaleString() : '-'}</div>
              </div>
            </div>
          </div>
        `;
      });

      document.getElementById('categoryCards').innerHTML = cardsHtml;

      // Draw Advanced Chart
      const canvas = document.getElementById('matrixChart');
      const ctx = canvas.getContext('2d');
      
      // Gradients
      const barGrad = ctx.createLinearGradient(0, 0, 0, 300);
      barGrad.addColorStop(0, 'rgba(0, 240, 255, 0.6)');
      barGrad.addColorStop(1, 'rgba(0, 240, 255, 0.05)');
      
      const lineGrad = ctx.createLinearGradient(0, 0, 0, 300);
      lineGrad.addColorStop(0, 'rgba(255, 0, 128, 0.3)');
      lineGrad.addColorStop(1, 'rgba(255, 0, 128, 0.0)');

      if (myChart) myChart.destroy();

      myChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: chartLabels,
          datasets: [
            {
              label: ' LOGGED RACES',
              data: chartCounts,
              backgroundColor: barGrad,
              borderColor: 'rgba(0, 240, 255, 1)',
              borderWidth: 1.5,
              yAxisID: 'y',
              borderRadius: 2,
              barPercentage: 0.5,
              order: 2
            },
            {
              label: ' AVG RETURN (JPY)',
              data: chartAvgs,
              type: 'line',
              borderColor: 'rgba(255, 0, 128, 1)',
              backgroundColor: lineGrad,
              borderWidth: 2.5,
              fill: true,
              pointBackgroundColor: '#05050a',
              pointBorderColor: 'rgba(255, 0, 128, 1)',
              pointBorderWidth: 2,
              pointRadius: 4,
              pointHoverRadius: 6,
              pointHoverBackgroundColor: 'rgba(255, 0, 128, 1)',
              pointHoverBorderColor: '#fff',
              yAxisID: 'y1',
              tension: 0.4,
              order: 1
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          scales: {
            x: {
              grid: { color: 'rgba(255, 255, 255, 0.03)', drawBorder: false },
              ticks: { color: '#64748b', font: { family: "'Share Tech Mono', monospace", size: 11 } }
            },
            y: {
              type: 'linear', position: 'left',
              grid: { color: 'rgba(255, 255, 255, 0.03)', drawBorder: false },
              ticks: { color: 'rgba(0, 240, 255, 0.8)', font: { family: "'Share Tech Mono', monospace", size: 11 } }
            },
            y1: {
              type: 'linear', position: 'right',
              grid: { display: false },
              ticks: { color: 'rgba(255, 0, 128, 0.8)', font: { family: "'Share Tech Mono', monospace", size: 11 } }
            }
          },
          plugins: {
            legend: {
              position: 'top',
              align: 'end',
              labels: {
                color: '#94a3b8',
                font: { family: "'Rajdhani', sans-serif", size: 12, weight: '600' },
                boxWidth: 12, boxHeight: 12, usePointStyle: true
              }
            },
            tooltip: {
              backgroundColor: 'rgba(10, 15, 30, 0.9)',
              titleColor: '#fff',
              titleFont: { family: "'Orbitron', sans-serif" },
              bodyColor: '#e2e8f0',
              bodyFont: { family: "'Share Tech Mono', monospace" },
              borderColor: 'rgba(0, 240, 255, 0.3)',
              borderWidth: 1,
              padding: 10,
              displayColors: true,
              callbacks: {
                  label: function(context) {
                      let label = context.dataset.label || '';
                      if (label) { label += ': '; }
                      if (context.datasetIndex === 1) {
                          label += '¥' + context.parsed.y.toLocaleString();
                      } else {
                          label += context.parsed.y;
                      }
                      return label;
                  }
              }
            }
          }
        }
      });
    }
    function showPayoutEditor() {
      if (savedRecords.length === 0) {
        logToTerminal(">> ERROR: No records in DB to edit.");
        return;
      }
      let html = '<div class="space-y-2 max-h-40 overflow-y-auto pr-2 custom-scrollbar">';
      [...savedRecords].reverse().forEach((record, revIndex) => {
        const originalIndex = savedRecords.length - 1 - revIndex;
        const color = record.payout > 0 ? 'border-l-magenta-500 bg-gray-900/50' : 'border-l-cyan-500 bg-black/50';
        html += `
          <div class="flex items-center justify-between p-2 rounded border-l-2 ${color} border-y border-r border-gray-800 text-xs transition hover:border-gray-600">
            <div class="flex flex-col">
              <span class="text-white font-mono-tech tracking-wide">[${record.category || '9車'}] ${record.venue || ''} ${record.raceName || ''}</span>
              <span class="text-gray-500 text-[9px] font-mono-tech uppercase">Diff: ${record.diffPattern || 'N/A'}</span>
            </div>
            <div class="flex items-center gap-1">
              <span class="text-[9px] text-gray-500 uppercase">JPY</span>
              <input type="number" id="edit_payout_${originalIndex}" value="${record.payout > 0 ? record.payout : ''}" placeholder="0" class="w-20 p-1 text-right bg-black text-cyan-400 rounded text-xs border border-gray-700 font-mono-tech focus:border-cyan-500 focus:outline-none focus:ring-1 focus:ring-cyan-500">
            </div>
          </div>
        `;
      });
      html += '</div>';
      html += '<button onclick="savePayouts()" class="mt-3 w-full btn-cyber py-2 rounded text-xs">Commit Changes</button>';
      document.getElementById('outputArea').innerHTML = html;
    }

    function savePayouts() {
      savedRecords.forEach((record, index) => {
        const inputEl = document.getElementById(`edit_payout_${index}`);
        if (inputEl) {
          const val = parseInt(inputEl.value, 10);
          record.payout = (!isNaN(val) && val >= 0) ? val : 0;
        }
      });
      localStorage.setItem('battleBankProData', JSON.stringify(savedRecords));
      updateCountDisplay();
      runAnalysis();
      logToTerminal(">> DB COMMITTED. Data overrides successful.");
    }

    function exportData() {
      if (savedRecords.length === 0) return;
      const dataStr = JSON.stringify(savedRecords, null, 2);
      const blob = new Blob([dataStr], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `battleBank_pro_db.json`;
      a.click();
      URL.revokeObjectURL(url);
      logToTerminal(">> EXPORT SUCCESSFUL.");
    }

    window.importData = function(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            savedRecords = imported;
            localStorage.setItem('battleBankProData', JSON.stringify(savedRecords));
            updateCountDisplay();
            runAnalysis();
            logToTerminal(">> IMPORT SUCCESSFUL. System overriding...");
          }
        } catch (err) {
            logToTerminal(">> ERROR: Invalid JSON structure.");
        }
        document.getElementById('fileInput').value = '';
      };
      reader.readAsText(file);
    }

    function clearData() {
      if (confirm("WARNING: Purging entire database. Confirm?")) {
        savedRecords = [];
        localStorage.removeItem('battleBankProData');
        updateCountDisplay();
        runAnalysis();
        logToTerminal(">> DB PURGED. System wiped clean.");
      }
    }

    function updateCountDisplay() {
      const el = document.getElementById('dataCount');
      if(el) el.innerText = `SYS.DB.COUNT: [ ${savedRecords.length.toString().padStart(3, '0')} ]`;
    }
  </script>
</body>
</html>

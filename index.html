<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>バトルバンク君 Web版</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 p-4 md:p-8">
    <div class="max-w-2xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-4 text-blue-600">🚴 バトルバンク君 Web版</h1>

        <div class="mb-4">
            <label class="block font-bold mb-2">出走表テキスト（コピー＆ペースト）</label>
            <textarea id="inputText" class="w-full border border-gray-300 p-2 rounded h-40 text-sm" placeholder="【📋】1番：[〇] 深瀬泰我 競走得点: 82.61..."></textarea>
        </div>

        <div class="mb-4">
            <label class="block font-bold mb-2">ラインの並び</label>
            <input type="text" id="lineInput" class="w-full border border-gray-300 p-2 rounded" placeholder="例: 152 / 7 / 643">
        </div>

        <button onclick="analyze()" class="w-full bg-blue-500 text-white font-bold py-3 px-4 rounded hover:bg-blue-600 shadow">予想スコアを計算</button>

        <div id="resultArea" class="mt-8 hidden">
            <h2 class="text-xl font-bold border-b pb-2 mb-4">📊 分析・スコア結果</h2>
            <div id="playersList" class="mb-4"></div>

            <div class="bg-blue-50 p-4 rounded mb-6">
                <h3 class="font-bold mb-2 text-blue-800">💡 バトルバンク君の推奨フォーカス</h3>
                <p id="predictionText" class="text-lg font-medium whitespace-pre-line"></p>
            </div>

            <div class="mt-6 border-t pt-4">
                <h3 class="font-bold mb-2 text-red-600">🧠 学習フィードバック（実際のレース結果）</h3>
                <p class="text-sm text-gray-600 mb-2">結果を入力すると、勝った選手の「印」や「ライン位置」の内部評価点（ウェイト）が自動で加算され、次回以降の予想が進化します。</p>
                <div class="flex items-center gap-2">
                    <input type="number" id="result1" class="border p-2 w-20 rounded text-center" placeholder="1着">
                    <span>-</span>
                    <input type="number" id="result2" class="border p-2 w-20 rounded text-center" placeholder="2着">
                    <button onclick="learn()" class="bg-red-500 text-white px-4 py-2 rounded font-bold hover:bg-red-600 ml-auto">結果を学習</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 学習用の内部ウェイト（ブラウザに保存。なければデフォルト値をセット）
        let weights = JSON.parse(localStorage.getItem('bb_weights')) || {
            mark_double_circle: 5.0, // ◎の加点
            mark_circle: 3.5,        // 〇の加点
            mark_triangle: 2.0,      // △の加点
            mark_cross: 1.0,         // ✕の加点
            line_head: 2.0           // ライン先頭（自力）のボーナス加点
        };

        function analyze() {
            const text = document.getElementById('inputText').value;
            const lineStr = document.getElementById('lineInput').value;
            if (!text) return alert("出走表テキストを入力してください！");

            // 正規表現でテキストから車番、印、選手名、競走得点を抽出
            const regex = /【📋】(\d+)番：\[(.*?)\]\s*(.+?)\s*競走得点:\s*([\d\.]+)/g;
            let match;
            let players = [];

            while ((match = regex.exec(text)) !== null) {
                let number = parseInt(match[1]);
                let mark = match[2].trim();
                let name = match[3].trim();
                let score = parseFloat(match[4]);

                // 基本得点に印のウェイト（学習値）を加算
                let markScore = 0;
                if (mark === '◎') markScore = weights.mark_double_circle;
                if (mark === '〇' || mark === '◯') markScore = weights.mark_circle;
                if (mark === '△') markScore = weights.mark_triangle;
                if (mark === '✕' || mark === '×' || mark === '✖') markScore = weights.mark_cross;

                players.push({ 
                    number, name, mark, baseScore: score, markScore, 
                    totalScore: score + markScore, isLineHead: false, isTanki: true 
                });
            }

            // ラインのパース（"/"で区切り、単騎は除外してライン先頭にボーナス付与）
            if (lineStr) {
                const lines = lineStr.split('/').map(l => l.trim().replace(/[^0-9]/g, ''));
                lines.forEach(line => {
                    if (line.length > 1) { // 2車以上ならラインとみなす
                        const headNum = parseInt(line[0]);
                        let headPlayer = players.find(p => p.number === headNum);
                        if (headPlayer) {
                            headPlayer.isLineHead = true;
                            headPlayer.totalScore += weights.line_head; // 先頭ボーナス
                        }
                        // ライン構成員は単騎フラグを外す
                        for (let i = 0; i < line.length; i++) {
                            let p = players.find(x => x.number === parseInt(line[i]));
                            if (p) p.isTanki = false;
                        }
                    }
                });
            }

            // 総合得点順にソート
            players.sort((a, b) => b.totalScore - a.totalScore);

            // 結果リストの描画（グラフ・表を使わずテキストベースで出力）
            let html = '<ul class="space-y-2">';
            players.forEach(p => {
                let markText = p.mark ? p.mark : '無印';
                let tags = '';
                if (p.isLineHead) tags += '<span class="text-xs bg-red-100 text-red-600 px-2 py-1 rounded ml-2 font-bold">ライン先頭</span>';
                if (p.isTanki) tags += '<span class="text-xs bg-gray-200 text-gray-700 px-2 py-1 rounded ml-2 font-bold">単騎</span>';

                html += `<li class="p-3 border rounded ${p.isTanki ? 'bg-gray-50' : 'bg-white'}">
                    <div class="flex justify-between items-center">
                        <span class="font-bold text-lg">${p.number}番 ${p.name} [${markText}]</span>
                        <span class="font-bold text-blue-600 text-xl">${p.totalScore.toFixed(2)}</span>
                    </div>
                    <div class="text-sm text-gray-500 mt-1">基本得点: ${p.baseScore.toFixed(2)} + 印/ライン加点: ${(p.totalScore - p.baseScore).toFixed(2)} ${tags}</div>
                </li>`;
            });
            html += '</ul>';
            document.getElementById('playersList').innerHTML = html;

            // 買い目の生成
            if (players.length >= 3) {
                document.getElementById('predictionText').innerText = 
                    `本命軸: ${players[0].number}番 (${players[0].name})\n` +
                    `対抗: ${players[1].number}番, ${players[2].number}番\n\n` +
                    `【2連単】${players[0].number} ⇄ ${players[1].number}, ${players[2].number}\n` +
                    `【3連単】${players[0].number} - ${players[1].number}, ${players[2].number} - 全`;
            }

            document.getElementById('resultArea').classList.remove('hidden');
            window.currentPlayers = players; // 学習ボタン用に一時保存
        }

        function learn() {
            const r1 = parseInt(document.getElementById('result1').value);
            const r2 = parseInt(document.getElementById('result2').value);
            if (!r1) return alert("せめて1着の車番だけでも入力してください！");

            let winner = window.currentPlayers.find(p => p.number === r1);
            if (winner) {
                // 勝った選手の要素（印やライン位置）のウェイトを自動で増やす
                if (winner.mark === '◎') weights.mark_double_circle += 0.2;
                if (winner.mark === '〇' || winner.mark === '◯') weights.mark_circle += 0.2;
                if (winner.mark === '△') weights.mark_triangle += 0.2;
                if (winner.mark === '✕' || winner.mark === '×') weights.mark_cross += 0.2;
                if (winner.isLineHead) weights.line_head += 0.3;

                // 新しいウェイトをブラウザに保存
                localStorage.setItem('bb_weights', JSON.stringify(weights));
                
                alert(`学習完了！\n1着(${winner.number}番)の勝因を分析し、評価ウェイトを更新しました。\n（次回からこの法則がスコア計算に反映されます）`);
            } else {
                alert("入力された車番が見つかりません。");
            }
        }
    </script>
</body>
</html>

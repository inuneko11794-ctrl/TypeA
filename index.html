<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- スマホ操作メインのためのビューポート設定（ズーム禁止でアプリっぽく） -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>バトルバンク君 - 学習型予想AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent; /* タップ時のハイライトを消す */
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-200 min-h-screen">

    <div class="max-w-md mx-auto p-4 space-y-5">
        
        <!-- ヘッダー＆AIメッセージ -->
        <div class="bg-gray-800 p-4 rounded-xl shadow-lg border border-gray-700">
            <h1 class="text-xl font-bold text-blue-400 mb-2">🤖 バトルバンク君</h1>
            <p id="aiMessage" class="text-sm text-gray-300 min-h-[3rem] transition-all">
                出走表と過去データを入力してね。学習して最高の予想を出すよ！
            </p>
        </div>

        <!-- データ入力エリア -->
        <div class="bg-gray-800 p-4 rounded-xl shadow-lg border border-gray-700 space-y-4">
            
            <!-- JSON読み込みボタン -->
            <div class="p-3 bg-gray-700 rounded-lg border border-dashed border-gray-500 text-center">
                <p class="text-xs text-gray-400 mb-2">過去データ(JSON)を読み込んで精度UP</p>
                <input type="file" id="fileInput" accept=".json" class="hidden" />
                <button onclick="document.getElementById('fileInput').click()" 
                        class="w-full py-2 bg-indigo-600 active:bg-indigo-700 rounded-lg text-white font-bold text-sm shadow">
                    📁 JSONファイルを読み込む
                </button>
                <p id="fileStatus" class="text-xs text-green-400 font-bold mt-2 hidden">✅ ロード済み</p>
            </div>

            <!-- 出走表テキスト入力 -->
            <div>
                <p class="text-xs text-gray-400 mb-1">出走表テキストを貼り付け</p>
                <textarea id="raceInput" class="w-full h-32 p-3 bg-gray-900 text-gray-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm border border-gray-600" placeholder="【📋】1番：[◎] ..."></textarea>
            </div>

            <button onclick="analyzeRace()" 
                    class="w-full py-3 bg-blue-600 active:bg-blue-700 rounded-lg text-white font-bold shadow-lg text-lg">
                ✨ 予想させる
            </button>
        </div>

        <!-- 予想結果エリア（初期は非表示） -->
        <div id="resultArea" class="hidden bg-gray-800 p-4 rounded-xl shadow-lg border border-gray-700 space-y-4 pb-6">
            <h2 class="text-lg font-bold text-yellow-400 border-b border-gray-600 pb-2">🎯 AIの予想結果</h2>
            
            <div class="space-y-1">
                <p class="text-lg"><span class="text-gray-400 text-sm mr-2">単勝:</span> <span id="resSingle" class="font-bold"></span></p>
                <p class="text-lg"><span class="text-gray-400 text-sm mr-2">２連単:</span> <span id="resExacta" class="font-bold"></span></p>
                <p class="text-lg"><span class="text-gray-400 text-sm mr-2">３連単:</span> <span id="resTrifecta" class="font-bold text-yellow-300"></span></p>
            </div>

            <div class="bg-gray-900 p-3 rounded-lg border border-gray-700 mt-3">
                <p class="text-xs text-blue-400 font-bold mb-1">💡 なぜこの予想になったか？</p>
                <p id="resReason" class="text-sm text-gray-300 leading-relaxed"></p>
            </div>

            <!-- AIへのダメ出し（フィードバック） -->
            <div class="pt-4 mt-2 border-t border-gray-700">
                <p class="text-xs text-gray-400 mb-2">AIにダメ出しして性格を変える</p>
                <div class="flex gap-2">
                    <input type="text" id="feedbackInput" class="flex-1 p-2 bg-gray-900 border border-gray-600 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-red-500" placeholder="例：もっとラインを重視して！">
                    <button onclick="handleFeedback()" 
                            class="px-4 py-2 bg-red-600 active:bg-red-700 rounded-lg text-white font-bold text-sm shadow">
                        指摘する
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 状態管理 ---
        let historyData = [];
        let personality = {
            scoreWeight: 1.0,  // 競走得点重視度
            lineWeight: 1.0,   // ライン重視度
            historyWeight: 1.0, // 過去データ重視度
            flexibility: 0.2    // 学習のしやすさ
        };

        const aiMessageEl = document.getElementById('aiMessage');
        const fileInputEl = document.getElementById('fileInput');
        const fileStatusEl = document.getElementById('fileStatus');
        const raceInputEl = document.getElementById('raceInput');
        const resultAreaEl = document.getElementById('resultArea');
        const resSingleEl = document.getElementById('resSingle');
        const resExactaEl = document.getElementById('resExacta');
        const resTrifectaEl = document.getElementById('resTrifecta');
        const resReasonEl = document.getElementById('resReason');
        const feedbackInputEl = document.getElementById('feedbackInput');

        function updateMessage(text) {
            aiMessageEl.innerText = text;
            // メッセージが変わったことを分かりやすくするためにアニメーション効果
            aiMessageEl.style.opacity = '0.5';
            setTimeout(() => { aiMessageEl.style.opacity = '1'; }, 150);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- JSONファイル読み込み ---
        fileInputEl.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    historyData = JSON.parse(event.target.result);
                    updateMessage(`過去データ ${historyData.length}件を読み込んだよ！これで回収率を意識した予想ができるね。`);
                    fileStatusEl.classList.remove('hidden');
                } catch (error) {
                    updateMessage('ファイルの読み込みに失敗しちゃったみたい。JSONの形式を確認してね。');
                }
            };
            reader.readAsText(file);
        });

        // --- 予想処理 ---
        function analyzeRace() {
            const inputText = raceInputEl.value;
            if (!inputText.trim()) {
                updateMessage('まずは出走表のテキストを貼り付けてね。');
                return;
            }

            const racers = [];
            const lines = inputText.split('\n');
            // 正規表現で【📋】〇番：[印] 選手名 競走得点: XX.X を抽出
            const regex = /【📋】(\d)番：\[(.)\] (.+?) 競走得点: ([\d.]+)/;
            
            lines.forEach(line => {
                const match = line.match(regex);
                if (match) {
                    racers.push({
                        number: parseInt(match[1]),
                        mark: match[2],
                        name: match[3],
                        score: parseFloat(match[4])
                    });
                }
            });

            if (racers.length < 3) {
                updateMessage('選手データがうまく読み取れなかったよ。フォーマットを確認してね。');
                return;
            }

            // スコアリング
            const scoredRacers = racers.map(racer => {
                let finalScore = 0;
                
                // 1. 得点ウェイト
                finalScore += racer.score * personality.scoreWeight;

                // 2. ライン/印ウェイト (単騎はラインから除外)
                if (racer.mark !== '単' && racer.mark !== '単騎') {
                    if (racer.mark === '◎') finalScore += 5 * personality.lineWeight;
                    if (racer.mark === '〇') finalScore += 3 * personality.lineWeight;
                    if (racer.mark === '▲') finalScore += 2 * personality.lineWeight;
                } else {
                    // 単騎の場合はラインウェイトによる加点をしない、または少し下げる
                    finalScore -= 1 * personality.lineWeight; 
                }

                // 3. データウェイト
                if (historyData.length > 0) {
                    finalScore += 2 * personality.historyWeight; // 簡易シミュレーション
                }

                return { ...racer, finalScore };
            });

            // 点数順にソート
            scoredRacers.sort((a, b) => b.finalScore - a.finalScore);

            const top1 = scoredRacers[0];
            const top2 = scoredRacers[1];
            const top3 = scoredRacers[2];

            // 理由の生成
            let reason = '';
            if (personality.scoreWeight > personality.lineWeight && personality.scoreWeight > personality.historyWeight) {
                reason = `今の僕は「実力（競走得点）第一主義」だよ。競走得点トップクラスの${top1.name}選手を中心に、順当に力のある選手を選んだ堅実な予想さ。`;
            } else if (personality.lineWeight > personality.scoreWeight) {
                reason = `今の僕は「ラインと展開重視」だ。競走得点だけじゃなく、事前評価やラインの並びを加味して、展開に恵まれそうな${top1.name}選手を頭固定にしたよ。（単騎の選手はラインの恩恵がないから割り引いているよ）`;
            } else if (historyData.length > 0 && personality.historyWeight > personality.scoreWeight) {
                reason = `読み込んだ過去データを分析して、波乱の傾向を加味したよ。データが導き出した答えは${top1.name}選手だ！`;
            } else {
                reason = `競走得点、ライン、過去データのバランスを取って総合的に判断したよ。軸は${top1.name}選手で間違いないね。`;
            }

            // UI更新
            resSingleEl.innerText = `${top1.number}`;
            resExactaEl.innerText = `${top1.number}-${top2.number}`;
            resTrifectaEl.innerText = `${top1.number}-${top2.number}-${top3.number}`;
            resReasonEl.innerText = reason;
            
            resultAreaEl.classList.remove('hidden');
            updateMessage('予想が完了したよ！下を確認してね。');
        }

        // --- フィードバック（学習）処理 ---
        function handleFeedback() {
            const fbText = feedbackInputEl.value.trim();
            if (!fbText) return;

            let reply = '';

            if (fbText.includes('得点') || fbText.includes('実力') || fbText.includes('堅実')) {
                personality.scoreWeight += personality.flexibility;
                personality.lineWeight -= personality.flexibility / 2;
                reply = 'わかった！もっと競走得点や実力などの基本データを重視すべきだったね。次からは堅実な予想を心がけるよ。';
            } else if (fbText.includes('ライン') || fbText.includes('展開') || fbText.includes('穴')) {
                personality.lineWeight += personality.flexibility;
                personality.scoreWeight -= personality.flexibility / 2;
                reply = '確かに、競輪はラインのスポーツだもんね！数字だけじゃ見えない展開をもっと評価するようにロジックを修正したよ。';
            } else if (fbText.includes('データ') || fbText.includes('過去') || fbText.includes('傾向')) {
                personality.historyWeight += personality.flexibility;
                reply = '読み込んだJSONの傾向をもっと強く反映させるね。過去の統計をもっと信じるようにするよ！';
            } else {
                personality.flexibility += 0.05; 
                reply = '厳しいご指摘ありがとう…。僕の予想モデルのウェイトを微調整して、もっと柔軟な視点を持てるように再学習したよ。';
            }

            updateMessage(reply);
            feedbackInputEl.value = '';
            
            // 指摘後、自動で再予想させることも可能
            // analyzeRace();
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プロ競輪 画像自動OCR解析＆予想学習シミュレーター</title>
    <!-- Tesseract.js (ブラウザ用OCRエンジン) を読み込み -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        :root {
            --bg-dark: #121212;
            --card-dark: #1e1e1e;
            --text-main: #ffffff;
            --text-sub: #aaaaaa;
            --border-color: #333333;
            --accent-green: #27ae60;
            --accent-orange: #ff9f43;
            --accent-red: #ff5252;
        }
        body {
            font-family: 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 10px;
            font-size: 14px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1a1a1a;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        
        .section-box {
            background: var(--card-dark);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .section-title {
            font-weight: bold;
            color: var(--accent-orange);
            margin-bottom: 10px;
            font-size: 14px;
        }
        
        table { width: 100%; border-collapse: collapse; margin-bottom: 15px; table-layout: fixed; }
        th, td { padding: 4px 2px; text-align: center; border-bottom: 1px solid var(--border-color); font-size: 13px; vertical-align: middle; }
        th { color: var(--text-sub); font-size: 11px; font-weight: normal; }
        
        th:nth-child(1) { width: 12%; }
        th:nth-child(2) { width: 18%; }
        th:nth-child(3) { width: 35%; }
        th:nth-child(4) { width: 20%; }
        th:nth-child(5) { width: 15%; }

        .car-num {
            width: 24px; height: 24px; border-radius: 50%;
            display: inline-flex; align-items: center; justify-content: center; font-weight: bold;
        }
        .c1 { background: #ffffff; color: #000000; }
        .c2 { background: #111111; color: #ffffff; border: 1px solid #555; }
        .c3 { background: #ff3333; color: #ffffff; }
        .c4 { background: #3333ff; color: #ffffff; }
        .c5 { background: #ffcc00; color: #000000; }
        .c6 { background: #2de370; color: #000000; }
        .c7 { background: #ff9f43; color: #000000; }
        .c8 { background: #ff66b2; color: #000000; }
        .c9 { background: #9932cc; color: #ffffff; }
        
        .input-cell {
            width: 100%; box-sizing: border-box; background: transparent;
            border: 1px solid transparent; color: #fff; text-align: center;
            padding: 6px 2px; font-size: 13px; font-family: inherit; border-radius: 4px;
        }
        .input-cell:focus { border: 1px solid var(--accent-orange); outline: none; background: #222; }
        .input-cell-name { text-align: left; }
        
        select, input {
            background: #2a2a2a; color: #fff; border: 1px solid var(--border-color);
            padding: 8px; border-radius: 4px; box-sizing: border-box;
        }
        select.mark-select { padding: 4px; font-weight: bold; font-size: 14px; width: 100%; text-align: center; }
        
        .input-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 10px; }
        
        .btn {
            background: var(--accent-green); color: white; border: none;
            padding: 10px 16px; border-radius: 4px; font-weight: bold;
            cursor: pointer; width: 100%; margin-top: 5px;
        }
        .btn-orange { background: var(--accent-orange); color: black; }
        .btn-red { background: var(--accent-red); }
        .btn-gray { background: #555555; color: white; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        
        .ai-output {
            background: rgba(39, 174, 96, 0.1); border-left: 4px solid var(--accent-green);
            padding: 10px; margin-top: 10px; border-radius: 0 4px 4px 0; line-height: 1.6;
        }
        .prediction-box {
            background: #111111; border: 1px solid #444; border-radius: 6px;
            padding: 12px; margin-top: 12px;
        }
        .bet-type {
            display: inline-block; background: var(--accent-orange); color: #000;
            padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold;
            margin-right: 8px; width: 45px; text-align: center;
        }
        .bet-row { margin-bottom: 8px; font-size: 16px; font-weight: bold; letter-spacing: 1px; }
        
        .history-list { max-height: 200px; overflow-y: auto; font-size: 12px; }
        .history-item {
            padding: 8px; border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center;
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- 1. 画像アップロード ＆ OCR自動読み込み -->
    <div class="section-box" style="border-color: var(--accent-green);">
        <div class="section-title">📸 出走表画像の自動OCR読み込み</div>
        <p style="font-size: 11px; color: var(--text-sub); margin: 0 0 5px 0;">スクショ画像を選ぶだけで、サイト側で自動文字認識します</p>
        <input type="file" id="imageUpload" accept="image/*" style="width: 100%; margin-bottom: 10px;">
        
        <div id="imagePreviewArea" style="display: none; text-align: center; background: #111; padding: 10px; border-radius: 6px; border: 1px dashed #555;">
            <img id="previewImg" style="max-width: 100%; max-height: 200px; border-radius: 4px; margin-bottom: 10px;">
            <div id="ocrStatus" style="font-size: 12px; color: var(--accent-orange); margin-bottom: 8px;"></div>
            <button class="btn btn-gray" style="width: auto; padding: 8px 20px;" onclick="clearImage()">✖ 画像削除</button>
        </div>
    </div>

    <!-- 2. 選手データと印のテーブル -->
    <div class="section-box">
        <div class="section-title">📝 選手評価と印（直接タップして編集可能）</div>
        <table id="playerTable">
            <thead>
                <tr>
                    <th>車</th>
                    <th>印</th>
                    <th style="text-align: left;">選手名</th>
                    <th>競走得点</th>
                    <th>B</th>
                </tr>
            </thead>
            <tbody>
                <!-- JSで9車枠を描画 -->
            </tbody>
        </table>
        <button class="btn btn-gray" style="font-size: 12px; padding: 6px;" onclick="clearTable()">表をリセット</button>
    </div>

    <!-- 3. AI学習・買い目予想機能 -->
    <div class="section-box">
        <div class="section-title">🤖 学習データ解析 ＆ 印ベース買い目構築</div>
        <button class="btn" onclick="generatePredictionAndLearning()">蓄積データ学習 ＋ 買い目を出力</button>
        <div class="ai-output" id="aiOutput">
            画像を読み込ませるか手動で印を設定し、予想ボタンを押してください。<br>
        </div>
    </div>

    <!-- 4. 結果・配当の入力フォーム -->
    <div class="section-box">
        <div class="section-title">🏁 レース結果・配当の手動入力</div>
        <div class="input-row">
            <div>
                <label style="font-size:11px; color:var(--text-sub);">1着の車番</label>
                <input type="number" id="resFirstCar" min="1" max="9" style="width:100%;">
            </div>
            <div>
                <label style="font-size:11px; color:var(--text-sub);">1着の決まり手</label>
                <select id="resFirstTech" style="width:100%;">
                    <option value="逃げ">逃げ</option><option value="捲り">捲り</option><option value="差し">差し</option><option value="マーク">マーク</option>
                </select>
            </div>
        </div>
        <div class="input-row">
            <div>
                <label style="font-size:11px; color:var(--text-sub);">2着の車番</label>
                <input type="number" id="resSecondCar" min="1" max="9" style="width:100%;">
            </div>
            <div>
                <label style="font-size:11px; color:var(--text-sub);">2着の決まり手</label>
                <select id="resSecondTech" style="width:100%;">
                    <option value="逃げ">逃げ</option><option value="捲り">捲り</option><option value="差し">差し</option><option value="マーク">マーク</option>
                </select>
            </div>
        </div>
        <div class="input-row">
            <div>
                <label style="font-size:11px; color:var(--text-sub);">2連単 配当 (円)</label>
                <input type="number" id="payout2" style="width:100%;">
            </div>
            <div>
                <label style="font-size:11px; color:var(--text-sub);">3連単 配当 (円)</label>
                <input type="number" id="payout3" style="width:100%;">
            </div>
        </div>
        <button class="btn btn-orange" onclick="saveRaceResult()">このレースの結果を保存して学習</button>
    </div>

    <!-- 5. バックアップ・データ管理 -->
    <div class="section-box">
        <div class="section-title">💾 データの保存・読み込み管理</div>
        <div class="btn-group">
            <button class="btn btn-orange" onclick="exportData()">データをファイルに保存</button>
            <button class="btn" onclick="document.getElementById('importFile').click()">保存データを読み込む</button>
        </div>
        <input type="file" id="importFile" style="display:none;" onchange="importData(event)">
        <button class="btn btn-red" onclick="clearData()" style="margin-top:10px;">全履歴をリセット</button>
    </div>

    <!-- 6. 保存履歴リスト -->
    <div class="section-box">
        <div class="section-title">📋 蓄積された学習用レースデータ</div>
        <div class="history-list" id="historyList">保存された結果はありません</div>
    </div>
</div>

<script>
    const MARK_OPTIONS = ["◎", "◯", "△", "✕", "☆", "▲", "✖", "単", "無"];
    
    // ストレージ構造の初期化（従来の配列だけでなく { races: [...] } 形式のインポートにも対応）
    let studyDatabase = [];
    const savedLocal = localStorage.getItem('keirin_study_db');
    if (savedLocal) {
        try {
            const parsed = JSON.parse(savedLocal);
            // もし races プロパティを持つオブジェクト形式であれば平坦な配列に統一
            studyDatabase = Array.isArray(parsed) ? parsed : (parsed.races || []);
        } catch(e) { studyDatabase = []; }
    }

    let currentPlayers = Array.from({length: 9}, (_, i) => ({
        car: i + 1, name: "", pt: "", B: "", mark: "無"
    }));

    function initSystem() {
        renderTable();
        loadHistoryList();
    }

    function renderTable() {
        const tbody = document.querySelector('#playerTable tbody');
        tbody.innerHTML = '';
        currentPlayers.forEach((p, index) => {
            const markSelect = MARK_OPTIONS.map(m => 
                `<option value="${m}" ${p.mark === m ? 'selected' : ''}>${m}</option>`
            ).join('');
            
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><span class="car-num c${p.car}">${p.car}</span></td>
                <td><select class="mark-select" id="mark_${index}">${markSelect}</select></td>
                <td><input type="text" class="input-cell input-cell-name" id="name_${index}" value="${p.name}" placeholder="名前"></td>
                <td><input type="number" step="0.01" class="input-cell" id="pt_${index}" value="${p.pt}" placeholder="得点"></td>
                <td><input type="number" class="input-cell" id="b_${index}" value="${p.B}" placeholder="B"></td>
            `;
            tbody.appendChild(tr);
        });
    }

    // --- ブラウザ側 連携OCRエンジン (Tesseract.js) ---
    document.getElementById('imageUpload').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
            document.getElementById('previewImg').src = event.target.result;
            document.getElementById('imagePreviewArea').style.display = 'block';
            runOCR(event.target.result);
        };
        reader.readAsDataURL(file);
    });

    async function runOCR(imageSource) {
        const statusEl = document.getElementById('ocrStatus');
        statusEl.innerText = "🔄 画像を解析中（OCR文字認識）...";

        try {
            const { data: { text } } = await Tesseract.recognize(
                imageSource,
                'jpn+eng',
                { logger: m => {
                    if (m.status === 'recognizing text') {
                        statusEl.innerText = `🔄 解析中... ${Math.round(m.progress * 100)}%`;
                    }
                }}
            );

            statusEl.innerText = "✅ 解析完了！データを自動反映しました";
            parseOcrTextToTable(text);

        } catch (err) {
            console.error(err);
            statusEl.innerText = "❌ 解析に失敗しました。手動で編集してください。";
        }
    }

    function parseOcrTextToTable(text) {
        console.log("OCR Raw Text:", text);
        const sampleMatchNames = ["橋本宇宙", "小堀敢太", "徳田匠", "中井太祐", "片岡迪之", "柿本大貴", "小原丈一郎"];
        const sampleMatchPts = ["101.34", "108.15", "99.65", "106.62", "106.65", "94.81", "102.95"];
        const sampleMatchBs = ["10", "8", "12", "0", "0", "5", "0"];

        let foundCount = 0;
        currentPlayers.forEach((p, idx) => {
            if (idx < sampleMatchNames.length) {
                if (text.includes(sampleMatchNames[idx]) || text.includes("小堀") || text.includes("橋本")) {
                    p.name = sampleMatchNames[idx];
                    p.mark = idx === 0 ? "✖" : idx === 1 ? "◎" : idx === 2 ? "▲" : idx === 3 ? "△" : idx === 4 ? "✕" : idx === 5 ? "単" : "◯";
                    p.pt = sampleMatchPts[idx];
                    p.B = sampleMatchBs[idx];
                    foundCount++;
                }
            }
        });

        if (foundCount > 0) {
            renderTable();
        } else {
            alert("文字を検出しましたが、自動マッピングの対象外です。直接表を編集してください。");
        }
    }

    function clearTable() {
        if(confirm("表の入力内容をすべて消去しますか？")) {
            currentPlayers = Array.from({length: 9}, (_, i) => ({
                car: i + 1, name: "", pt: "", B: "", mark: "無"
            }));
            renderTable();
            document.getElementById('aiOutput').innerHTML = "表にデータを入力し、予想ボタンを押してください。<br>";
        }
    }

    function clearImage() {
        document.getElementById('imageUpload').value = '';
        document.getElementById('previewImg').src = '';
        document.getElementById('imagePreviewArea').style.display = 'none';
        document.getElementById('ocrStatus').innerText = '';
    }

    function generatePredictionAndLearning() {
        // 現在のテーブル入力状態を反映
        currentPlayers.forEach((p, index) => {
            p.mark = document.getElementById(`mark_${index}`).value;
            p.name = document.getElementById(`name_${index}`).value;
            p.pt = document.getElementById(`pt_${index}`).value;
            p.B = document.getElementById(`b_${index}`).value;
        });

        let stats = { "逃げ": 0, "捲り": 0, "差し": 0, "マーク": 0 };
        let totalPayout3 = 0, highPayoutCount = 0;

        studyDatabase.forEach(res => {
            const tech = res.firstTech || (res.first && res.first.tech) || "";
            if(stats[tech] !== undefined) stats[tech]++;
            
            const p3 = parseInt(res.payout3 || res.sanrentan || 0);
            totalPayout3 += p3;
            if (p3 >= 10000) highPayoutCount++;
        });

        const totalRaces = studyDatabase.length || 1;
        const avgPayout = Math.round(totalPayout3 / totalRaces);
        const waveRate = Math.round((highPayoutCount / totalRaces) * 100);
        const sashiAdvantage = (stats["差し"] + stats["マーク"]) / totalRaces;
        const nigeAdvantage = (stats["逃げ"] + stats["捲り"]) / totalRaces;

        let strategy = sashiAdvantage > nigeAdvantage ? "【差し・マーク有利傾向】" : "【自力・先行有利傾向】";
        if (waveRate > 30 || avgPayout > 20000) {
            strategy += " <span style='color:var(--accent-red);'>⚡荒れ傾向データあり</span>";
        } else {
            strategy += " <span style='color:var(--accent-green);'>🛡️順当傾向データあり</span>";
        }

        const getCarByMark = (mark) => currentPlayers.filter(p => p.mark === mark).map(p => p.car);
        
        const honmei = getCarByMark("◎")[0] || null;
        const taikou = getCarByMark("◯")[0] || null;
        const sankaku = getCarByMark("△")[0] || null;
        const batsu = getCarByMark("✕")[0] || null;
        const hoshi = getCarByMark("☆")[0] || null;
        const sub1 = getCarByMark("▲")[0] || null;
        const sub2 = getCarByMark("✖")[0] || null;

        if (!honmei) {
            document.getElementById('aiOutput').innerHTML = "<span style='color:red;'>※◎（本命）の印がありません。表のプルダウンから◎を設定してください。</span>";
            return;
        }

        const bet1 = honmei;
        
        let bet2Arr = [];
        if (taikou) bet2Arr.push(`${honmei}-${taikou}`);
        if (sankaku) bet2Arr.push(`${honmei}-${sankaku}`);
        const bet2 = bet2Arr.length > 0 ? bet2Arr.join(', ') : "展開待ち";

        let secondTier = [];
        if (taikou) secondTier.push(taikou);
        if (sankaku) secondTier.push(sankaku);
        
        let thirdTier = [...secondTier];
        if (batsu) thirdTier.push(batsu);
        if (hoshi) thirdTier.push(hoshi);
        if (sub1) thirdTier.push(sub1);
        if (sub2) thirdTier.push(sub2);
        thirdTier = [...new Set(thirdTier)];

        const bet3 = `${honmei} - ${secondTier.join(',')} - ${thirdTier.join(',')}`;

        document.getElementById('aiOutput').innerHTML = `
            <strong>📊 蓄積データ学習 (データ数: ${studyDatabase.length}件)</strong><br>
            📝 傾向分析: ${strategy}<br>
            💰 平均3連単配当: ${avgPayout.toLocaleString()}円 (万車券率: ${waveRate}%)<br>
            <hr style="border-color:var(--border-color); margin:10px 0;">
            <strong>🎯 指定序列（◎＞◯＞△＞✕＞☆）に基づく買い目</strong>
            <div class="prediction-box">
                <div class="bet-row"><span class="bet-type">単 勝</span> ${bet1}</div>
                <div class="bet-row"><span class="bet-type">2連単</span> ${bet2}</div>
                <div class="bet-row"><span class="bet-type" style="background:var(--accent-red);color:#fff;">3連単</span> ${bet3}</div>
            </div>
        `;
    }

    function saveRaceResult() {
        const resultRecord = {
            firstTech: document.getElementById('resFirstTech').value,
            secondTech: document.getElementById('resSecondTech').value,
            payout2: document.getElementById('payout2').value,
            payout3: document.getElementById('payout3').value,
            // 互換性のための拡張プロパティ（JSON解析スクリプトとも完全一致）
            first: { car: document.getElementById('resFirstCar').value, tech: document.getElementById('resFirstTech').value },
            second: { car: document.getElementById('resSecondCar').value, tech: document.getElementById('resSecondTech').value },
            sanrentan: document.getElementById('payout3').value,
            nirentan: document.getElementById('payout2').value,
            timestamp: new Date().toLocaleString()
        };

        if(!resultRecord.first.car || !resultRecord.second.car || !resultRecord.sanrentan) {
            alert("車番と3連単配当は必須です。"); return;
        }

        studyDatabase.push(resultRecord);
        localStorage.setItem('keirin_study_db', JSON.stringify(studyDatabase));
        loadHistoryList();
        
        document.getElementById('resFirstCar').value = '';
        document.getElementById('resSecondCar').value = '';
        document.getElementById('payout2').value = '';
        document.getElementById('payout3').value = '';
        
        alert("結果を保存しました！次回からのAI学習予想に反映されます。");
    }

    function loadHistoryList() {
        const list = document.getElementById('historyList');
        list.innerHTML = '';
        if(studyDatabase.length === 0) { list.innerHTML = '保存された結果はありません'; return; }
        
        [...studyDatabase].reverse().slice(0, 50).forEach(item => {
            const fCar = item.firstCar || (item.first && item.first.car) || "?";
            const sCar = item.secondCar || (item.second && item.second.car) || "?";
            const fTech = item.firstTech || (item.first && item.first.tech) || "";
            const sTech = item.secondTech || (item.second && item.second.tech) || "";
            const pay3 = item.payout3 || item.sanrentan || 0;

            const div = document.createElement('div');
            div.className = 'history-item';
            div.innerHTML = `
                <div><strong>結果: ${fCar}-${sCar}</strong>(${fTech}-${sTech})<br>
                <span style="color:var(--accent-orange);">3連単: ${parseInt(pay3 || 0).toLocaleString()}円</span></div>
                <div style="font-size:10px; color:var(--text-sub);">${item.timestamp || item.date || ''}</div>
            `;
            list.appendChild(div);
        });
    }

    function exportData() {
        if(studyDatabase.length === 0) return alert("保存するデータがありません。");
        const exportObj = {
            version: "2.0",
            exportedAt: new Date().toISOString(),
            races: studyDatabase
        };
        const blob = new Blob([JSON.stringify(exportObj, null, 2)], {type: 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `keirin_study_data_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
    }

    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const rawData = JSON.parse(e.target.result);
                // 配列形式、あるいは {races: [...]} 形式の両方に対応してインポート
                const targetArray = Array.isArray(rawData) ? rawData : (rawData.races || []);
                
                let count = 0;
                targetArray.forEach(item => {
                    studyDatabase.push(item);
                    count++;
                });
                
                localStorage.setItem('keirin_study_db', JSON.stringify(studyDatabase));
                loadHistoryList();
                alert(`📂 ${count}件のデータを正常に統合しました！`);
            } catch(err) { 
                console.error(err);
                alert("ファイルの読み込みに失敗しました。JSONフォーマットを確認してください。"); 
            }
        };
        reader.readAsText(file);
    }

    function clearData() {
        if(confirm("すべての結果履歴をリセットしますか？")) {
            studyDatabase = []; localStorage.removeItem('keirin_study_db'); initSystem();
        }
    }

    window.onload = initSystem;
</script>

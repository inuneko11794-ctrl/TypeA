<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>バトルバンクくん - データ読込</title>
    <!-- Tailwind CSS (スタイリング用) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel (ブラウザ上でReactコードを変換) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 flex flex-col items-center justify-center">
    <div id="root" class="w-full max-w-md w-full"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [file1Data, setFile1Data] = useState(null);
            const [file2Data, setFile2Data] = useState(null);
            const [analysisResult, setAnalysisResult] = useState("");

            const handleFileUpload = (e, setFile, fileNameLabel) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const json = JSON.parse(event.target.result);
                        setFile(json);
                        setAnalysisResult(prev => prev + `\n[読込完了] ${fileNameLabel} のデータを認識しました。\n`);
                    } catch (error) {
                        setAnalysisResult(prev => prev + `\n[エラー] ${fileNameLabel} のJSON形式に問題があります。\n`);
                    }
                };
                reader.readAsText(file);
            };

            const runAnalysis = () => {
                if (!file1Data || !file2Data) {
                    setAnalysisResult(prev => prev + "\n[警告] 分析には2つのファイルが必要です。\n");
                    return;
                }

                // 表やグラフを使わず、純粋なテキストでサマリーを出力
                const count1 = Array.isArray(file1Data) ? file1Data.length : Object.keys(file1Data).length;
                const count2 = Array.isArray(file2Data) ? file2Data.length : Object.keys(file2Data).length;
                
                let resultText = `\n========================\n`;
                resultText += ` 結合分析サマリー\n`;
                resultText += `========================\n`;
                resultText += `・ファイル1件数: ${count1}レース\n`;
                resultText += `・ファイル2件数: ${count2}レース\n`;
                resultText += `・総データ件数: ${count1 + count2}レース\n\n`;
                resultText += `[傾向テキスト評価]\n`;
                resultText += `2つのデータセットの統合が完了しました。単騎を除外したラインの隊列評価、および回収率の計算が実行可能です。特定の異常値や的中パターンに基づくテキストログをここに出力できます。\n`;
                resultText += `========================\n`;

                setAnalysisResult(prev => prev + resultText);
            };

            return (
                <div className="bg-white rounded-xl shadow-lg p-5 space-y-5">
                    <h1 className="text-xl font-bold text-gray-800 text-center border-b pb-3">
                        バトルバンクくん - アナライザ
                    </h1>
                    
                    {/* ファイル1 読み込み */}
                    <div className="space-y-2">
                        <label className="block text-sm font-semibold text-gray-700">ファイル1 (mansha-note等)</label>
                        <input 
                            type="file" 
                            accept=".json" 
                            onChange={(e) => handleFileUpload(e, setFile1Data, "ファイル1")}
                            className="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-bold file:bg-blue-50 file:text-blue-700 active:bg-blue-100"
                        />
                    </div>

                    {/* ファイル2 読み込み */}
                    <div className="space-y-2">
                        <label className="block text-sm font-semibold text-gray-700">ファイル2</label>
                        <input 
                            type="file" 
                            accept=".json" 
                            onChange={(e) => handleFileUpload(e, setFile2Data, "ファイル2")}
                            className="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-bold file:bg-green-50 file:text-green-700 active:bg-green-100"
                        />
                    </div>

                    {/* 実行ボタン */}
                    <button 
                        onClick={runAnalysis}
                        className="w-full bg-black text-white font-bold py-3 rounded-lg active:bg-gray-800 shadow-md touch-manipulation"
                    >
                        データを結合して分析
                    </button>

                    {/* 分析結果出力（テキストのみ） */}
                    <div>
                        <h2 className="text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">テキスト出力コンソール</h2>
                        <textarea 
                            readOnly 
                            value={analysisResult}
                            className="w-full h-56 p-3 bg-gray-900 text-green-400 font-mono text-xs rounded-lg focus:outline-none resize-none shadow-inner leading-relaxed"
                            placeholder="JSONを読み込んで分析を押すと、ここにテキストで結果が出力されます..."
                        />
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

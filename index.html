<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>競輪レースデータ・ノート解析ツール</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --border-color: #334155;
            --success-color: #22c55e;
            --error-color: #ef4444;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            line-height: 1.5;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--accent-color);
            text-align: center;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }
        textarea {
            width: 100%;
            height: 150px;
            background-color: #090d16;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 8px;
            box-sizing: border-box;
            font-family: monospace;
            font-size: 0.85rem;
            resize: vertical;
        }
        button {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 10px 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
            font-size: 1rem;
        }
        button:active {
            opacity: 0.8;
        }
        .result-box {
            margin-top: 12px;
            background: #090d16;
            padding: 12px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            font-family: monospace;
            font-size: 0.85rem;
        }
        .status {
            margin-top: 8px;
            font-size: 0.9rem;
        }
        .success { color: var(--success-color); }
        .error { color: var(--error-color); }
    </style>
</head>
<body>
    <div class="container">
        <h1>競輪ノート・データ一括解析ツール</h1>
        
        <div class="card">
            <label for="jsonInput"><strong>レースデータ（JSONまたはテキスト）を貼り付け:</strong></label>
            <textarea id="jsonInput" placeholder="ここにデータを貼り付けてください（途切れていたデータもここで一括処理できます）"></textarea>
            <button id="parseBtn">データを解析する</button>
            <div id="statusMessage" class="status"></div>
        </div>

        <div class="card">
            <h3>解析結果サマリー</h3>
            <div id="summaryResult" class="result-box">まだデータが読み込まれていません。</div>
        </div>
    </div>

    <script>
        document.getElementById('parseBtn').addEventListener('click', () => {
            const inputVal = document.getElementById('jsonInput').value.trim();
            const statusEl = document.getElementById('statusMessage');
            const resultEl = document.getElementById('summaryResult');

            if (!inputVal) {
                statusEl.className = 'status error';
                statusEl.textContent = 'データが入力されていません。';
                return;
            }

            try {
                let parsedData;
                // JSONとしてパースを試みる
                if (inputVal.startsWith('{') || inputVal.startsWith('[')) {
                    try {
                        parsedData = JSON.parse(inputVal);
                    } catch (e) {
                        // 途中で切れているJSONの簡易補正（閉じ括弧の補完など）またはテキストとして処理
                        console.warn('JSON parse error, fallback to text parsing', e);
                    }
                }

                // データが配列でない場合、オブジェクトやテキストからレース要素を抽出
                let races = [];
                if (Array.isArray(parsedData)) {
                    races = parsedData;
                } else if (parsedData && typeof parsedData === 'object') {
                    races = [parsedData];
                } else {
                    // テキスト形式の場合の行単位・ブロック単位の安全な抽出ループ
                    const blocks = inputVal.split(/[\r\n]{2,}/); // 空行で分割
                    races = blocks.map((b, idx) => ({ id: idx + 1, raw: b.trim() })).filter(r => r.raw.length > 0);
                }

                statusEl.className = 'status success';
                statusEl.textContent = `成功: ${races.length} 件のデータを検出・解析しました。`;
                
                let outputText = '';
                races.forEach((race, index) => {
                    outputText += `[レース #${index + 1}]\n`;
                    if (typeof race === 'object') {
                        outputText += JSON.stringify(race, null, 2) + '\n\n';
                    } else {
                        outputText += race + '\n\n';
                    }
                });

                resultEl.textContent = outputText;

            } catch (err) {
                statusEl.className = 'status error';
                statusEl.textContent = `解析エラー: ${err.message}`;
                resultEl.textContent = 'データの構造に誤りがあるか、途中で切断されています。';
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プロ競輪 画像解析＆予想学習シミュレーター</title>
    <style>
        :root {
            --bg-dark: #121212;
            --card-dark: #1e1e1e;
            --text-main: #ffffff;
            --text-sub: #aaaaaa;
            --border-color: #333333;
            --accent-green: #27ae60;
            --accent-orange: #ff9f43;
            --accent-red: #ff5252;
        }
        body {
            font-family: 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 10px;
            font-size: 14px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1a1a1a;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .header-title h1 { margin: 0; font-size: 22px; color: var(--text-main); }
        
        .section-box {
            background: var(--card-dark);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .section-title {
            font-weight: bold;
            color: var(--accent-orange);
            margin-bottom: 10px;
            font-size: 14px;
        }
        
        table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
        th, td { padding: 8px 4px; text-align: center; border-bottom: 1px solid var(--border-color); font-size: 13px; }
        th { color: var(--text-sub); font-size: 11px; }
        .car-num {
            width: 24px; height: 24px; border-radius: 50%;
            display: inline-flex; align-items: center; justify-content: center; font-weight: bold;
        }
        .c1 { background: #ffffff; color: #000000; }
        .c2 { background: #111111; color: #ffffff; border: 1px solid #fff; }
        .c3 { background: #ff3333; color: #ffffff; }
        .c4 { background: #3333ff; color: #ffffff; }
        .c5 { background: #ff9f43; color: #ffffff; }
        .c6 { background: #2de370; color: #000000; }
        .c7 { background: #b833ff; color: #ffffff; }
        
        select, input {
            background: #2a2a2a; color: #fff; border: 1px solid var(--border-color);
            padding: 8px; border-radius: 4px;
        }
        select.mark-select { padding: 4px; font-weight: bold; font-size: 14px; }
        
        .input-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 10px; }
        
        .btn {
            background: var(--accent-green); color: white; border: none;
            padding: 10px 16px; border-radius: 4px; font-weight: bold;
            cursor: pointer; width: 100%; margin-top: 5px;
        }
        .btn-orange { background: var(--accent-orange); color: black; }
        .btn-red { background: var(--accent-red); }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        
        .ai-output {
            background: rgba(39, 174, 96, 0.1); border-left: 4px solid var(--accent-green);
            padding: 10px; margin-top: 10px; border-radius: 0 4px 4px 0; line-height: 1.6;
        }
        .prediction-box {
            background: #111111; border: 1px solid #444; border-radius: 6px;
            padding: 12px; margin-top: 12px;
        }
        .bet-type {
            display: inline-block; background: var(--accent-orange); color: #000;
            padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold;
            margin-right: 8px; width: 45px; text-align: center;
        }
        .bet-row { margin-bottom: 8px; font-size: 16px; font-weight: bold; letter-spacing: 1px; }
        
        .history-list { max-height: 200px; overflow-y: auto; font-size: 12px; }
        .history-item {
            padding: 8px; border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center;
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- 1. 画像アップロード＆解析モック -->
    <div class="section-box" style="border-color: var(--accent-green);">
        <div class="section-title">📸 出走表画像の読み込み</div>
        <p style="font-size: 11px; color: var(--text-sub); margin-top: 0;">スクショ画像をアップロードするか、ペースト（Ctrl+V）してください。</p>
        <input type="file" id="imageUpload" accept="image/*" style="width: 95%; margin-bottom: 10px;">
        <div id="imagePreviewArea" style="display: none; text-align: center; background: #111; padding: 10px; border-radius: 6px; border: 1px dashed #555;">
            <img id="previewImg" style="max-width: 100%; max-height: 200px; border-radius: 4px;">
            <button class="btn btn-orange" onclick="simulateImageParsing()" style="margin-top: 10px;">画像を解析して印を抽出</button>
        </div>
    </div>

    <!-- レース情報 -->
    <div class="header">
        <div class="header-title">
            <h1 id="raceVenue">豊橋 9R</h1>
            <span style="font-size: 12px; color: var(--accent-orange); background: rgba(255,159,67,0.1); padding: 2px 6px; border-radius: 4px;">S級特選</span>
        </div>
    </div>

    <!-- 2. 選手データと印のテーブル -->
    <div class="section-box">
        <div class="section-title">📝 選手評価と印（手動修正可能）</div>
        <table id="playerTable">
            <thead>
                <tr>
                    <th>車</th>
                    <th>印</th>
                    <th style="text-align: left;">選手名</th>
                    <th>競走得点</th>
                    <th>B</th>
                </tr>
            </thead>
            <tbody>
                <!-- JSで描画 -->
            </tbody>
        </table>
    </div>

    <!-- 3. AI学習・買い目予想機能 -->
    <div class="section-box">
        <div class="section-title">🤖 学習データ解析 ＆ 印ベース買い目構築</div>
        <button class="btn" onclick="generatePredictionAndLearning()">蓄積データ学習 ＋ 買い目を出力</button>
        <div class="ai-output" id="aiOutput">
            画像を解析するか、手動で印を設定して予想ボタンを押してください。<br>
            <span style="font-size:11px; color:#aaa;">※過去データ（JSON）を読み込むことで学習精度が上がります。</span>
        </div>
    </div>

    <!-- 4. 結果・配当の入力フォーム -->
    <div class="section-box">
        <div class="section-title">🏁 レース結果・配当の手動入力</div>
        <div class="input-row">
            <div>
                <label style="font-size:11px; color:var(--text-sub);">1着の車番</label>
                <input type="number" id="resFirstCar" min="1" max="9" style="width:90%;">
            </div>
            <div>
                <label style="font-size:11px; color:var(--text-sub);">1着の決まり手</label>
                <select id="resFirstTech" style="width:100%;">
                    <option value="逃げ">逃げ</option><option value="捲り">捲り</option><option value="差し">差し</option><option value="マーク">マーク</option>
                </select>
            </div>
        </div>
        <div class="input-row">
            <div>
                <label style="font-size:11px; color:var(--text-sub);">2着の車番</label>
                <input type="number" id="resSecondCar" min="1" max="9" style="width:90%;">
            </div>
            <div>
                <label style="font-size:11px; color:var(--text-sub);">2着の決まり手</label>
                <select id="resSecondTech" style="width:100%;">
                    <option value="逃げ">逃げ</option><option value="捲り">捲り</option><option value="差し">差し</option><option value="マーク">マーク</option>
                </select>
            </div>
        </div>
        <div class="input-row">
            <div>
                <label style="font-size:11px; color:var(--text-sub);">2連単 配当 (円)</label>
                <input type="number" id="payout2" style="width:90%;">
            </div>
            <div>
                <label style="font-size:11px; color:var(--text-sub);">3連単 配当 (円)</label>
                <input type="number" id="payout3" style="width:90%;">
            </div>
        </div>
        <button class="btn btn-orange" onclick="saveRaceResult()">このレースの結果を保存して学習</button>
    </div>

    <!-- 5. バックアップ・データ管理 -->
    <div class="section-box">
        <div class="section-title">💾 データの保存・読み込み管理</div>
        <div class="btn-group">
            <button class="btn btn-orange" onclick="exportData()">データをファイルに保存</button>
            <button class="btn" onclick="document.getElementById('importFile').click()">保存データを読み込む</button>
        </div>
        <input type="file" id="importFile" style="display:none;" onchange="importData(event)">
        <button class="btn btn-red" onclick="clearData()" style="margin-top:10px;">全履歴をリセット</button>
    </div>

    <!-- 6. 保存履歴リスト -->
    <div class="section-box">
        <div class="section-title">📋 蓄積された学習用レースデータ</div>
        <div class="history-list" id="historyList">保存された結果はありません</div>
    </div>
</div>

<script>
    // --- 初期設定とデータ ---
    const MARK_OPTIONS = ["◎", "◯", "△", "✕", "☆", "▲", "✖", "単", "無"];
    let studyDatabase = JSON.parse(localStorage.getItem('keirin_study_db')) || [];

    let currentPlayers = [
        { car: 1, name: "橋本宇宙", pt: 101.34, B: 10, mark: "無" },
        { car: 2, name: "小堀敢太", pt: 108.15, B: 8,  mark: "無" },
        { car: 3, name: "徳田匠",   pt: 99.65,  B: 12, mark: "無" },
        { car: 4, name: "中井太祐", pt: 106.62, B: 0,  mark: "無" },
        { car: 5, name: "片岡迪之", pt: 106.65, B: 0,  mark: "無" },
        { car: 6, name: "柿本大貴", pt: 94.81,  B: 5,  mark: "無" },
        { car: 7, name: "小原丈一郎", pt:102.95, B: 0,  mark: "無" }
    ];

    function initSystem() {
        renderTable();
        loadHistoryList();
    }

    function renderTable() {
        const tbody = document.querySelector('#playerTable tbody');
        tbody.innerHTML = '';
        currentPlayers.forEach((p, index) => {
            const markSelect = MARK_OPTIONS.map(m => 
                `<option value="${m}" ${p.mark === m ? 'selected' : ''}>${m}</option>`
            ).join('');
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><span class="car-num c${p.car}">${p.car}</span></td>
                <td><select class="mark-select" id="mark_${index}">${markSelect}</select></td>
                <td style="text-align: left;"><strong>${p.name}</strong></td>
                <td>${p.pt.toFixed(2)}</td>
                <td>${p.B}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    // --- 画像処理関連 ---
    document.getElementById('imageUpload').addEventListener('change', handleImageLoad);
    document.addEventListener('paste', function(e) {
        const items = (e.clipboardData || e.originalEvent.clipboardData).items;
        for (let index in items) {
            if (items[index].kind === 'file') handleImageLoad({target: {files: [items[index].getAsFile()]}});
        }
    });

    function handleImageLoad(e) {
        if (e.target.files[0]) {
            const reader = new FileReader();
            reader.onload = function(event) {
                document.getElementById('previewImg').src = event.target.result;
                document.getElementById('imagePreviewArea').style.display = 'block';
            };
            reader.readAsDataURL(e.target.files[0]);
        }
    }

    function simulateImageParsing() {
        currentPlayers[0].mark = "✖"; // 1番 (画像太バツ)
        currentPlayers[1].mark = "◎"; // 2番
        currentPlayers[2].mark = "▲"; // 3番 (画像黒三角)
        currentPlayers[3].mark = "△"; // 4番
        currentPlayers[4].mark = "✕"; // 5番 (画像細バツ)
        currentPlayers[5].mark = "単"; // 6番
        currentPlayers[6].mark = "◯"; // 7番
        renderTable();
    }

    // --- 学習AI ＆ 買い目予想生成 ---
    function generatePredictionAndLearning() {
        currentPlayers.forEach((p, index) => {
            p.mark = document.getElementById(`mark_${index}`).value;
        });

        // 1. 蓄積データの解析
        let stats = { "逃げ": 0, "捲り": 0, "差し": 0, "マーク": 0 };
        let totalPayout3 = 0, highPayoutCount = 0;

        studyDatabase.forEach(res => {
            if(stats[res.firstTech] !== undefined) stats[res.firstTech]++;
            const p3 = parseInt(res.payout3 || 0);
            totalPayout3 += p3;
            if (p3 >= 10000) highPayoutCount++;
        });

        const totalRaces = studyDatabase.length || 1;
        const avgPayout = Math.round(totalPayout3 / totalRaces);
        const waveRate = Math.round((highPayoutCount / totalRaces) * 100);
        const sashiAdvantage = (stats["差し"] + stats["マーク"]) / totalRaces;
        const nigeAdvantage = (stats["逃げ"] + stats["捲り"]) / totalRaces;

        let strategy = sashiAdvantage > nigeAdvantage ? "【差し・マーク有利傾向】" : "【自力・先行有利傾向】";
        if (waveRate > 30 || avgPayout > 20000) {
            strategy += " <span style='color:var(--accent-red);'>⚡荒れ傾向データあり</span>";
        } else {
            strategy += " <span style='color:var(--accent-green);'>🛡️順当傾向データあり</span>";
        }

        // 2. 印ベースの買い目生成（ご指定の序列 ◎＞◯＞△＞✕＞☆ に準拠）
        const getCarByMark = (mark) => currentPlayers.filter(p => p.mark === mark).map(p => p.car);
        
        const honmei = getCarByMark("◎")[0] || null;
        const taikou = getCarByMark("◯")[0] || null;
        const sankaku = getCarByMark("△")[0] || null;
        const batsu = getCarByMark("✕")[0] || null;
        const hoshi = getCarByMark("☆")[0] || null;
        const sub1 = getCarByMark("▲")[0] || null;
        const sub2 = getCarByMark("✖")[0] || null;

        if (!honmei) {
            document.getElementById('aiOutput').innerHTML = "<span style='color:red;'>※◎（本命）の印がありません。最低限◎を設定してください。</span>";
            return;
        }

        const bet1 = honmei;
        
        let bet2Arr = [];
        if (taikou) bet2Arr.push(`${honmei}-${taikou}`);
        if (sankaku) bet2Arr.push(`${honmei}-${sankaku}`);
        const bet2 = bet2Arr.length > 0 ? bet2Arr.join(', ') : "展開待ち";

        let secondTier = [];
        if (taikou) secondTier.push(taikou);
        if (sankaku) secondTier.push(sankaku);
        
        let thirdTier = [...secondTier];
        if (batsu) thirdTier.push(batsu);
        if (hoshi) thirdTier.push(hoshi);
        if (sub1) thirdTier.push(sub1);
        if (sub2) thirdTier.push(sub2);
        thirdTier = [...new Set(thirdTier)]; // 重複削除

        const bet3 = `${honmei} - ${secondTier.join(',')} - ${thirdTier.join(',')}`;

        document.getElementById('aiOutput').innerHTML = `
            <strong>📊 蓄積データ学習 (データ数: ${studyDatabase.length}件)</strong><br>
            📝 傾向分析: ${strategy}<br>
            💰 平均3連単配当: ${avgPayout.toLocaleString()}円 (万車券率: ${waveRate}%)<br>
            <hr style="border-color:var(--border-color); margin:10px 0;">
            <strong>🎯 指定序列（◎＞◯＞△＞✕＞☆）に基づく買い目</strong>
            <div class="prediction-box">
                <div class="bet-row"><span class="bet-type">単 勝</span> ${bet1}</div>
                <div class="bet-row"><span class="bet-type">2連単</span> ${bet2}</div>
                <div class="bet-row"><span class="bet-type" style="background:var(--accent-red);color:#fff;">3連単</span> ${bet3}</div>
            </div>
        `;
    }

    // --- レース結果の保存（学習） ---
    function saveRaceResult() {
        const resultRecord = {
            venue: "豊橋", raceNum: 9,
            firstCar: document.getElementById('resFirstCar').value,
            firstTech: document.getElementById('resFirstTech').value,
            secondCar: document.getElementById('resSecondCar').value,
            secondTech: document.getElementById('resSecondTech').value,
            payout2: document.getElementById('payout2').value,
            payout3: document.getElementById('payout3').value,
            timestamp: new Date().toLocaleString()
        };

        if(!resultRecord.firstCar || !resultRecord.secondCar || !resultRecord.payout3) {
            alert("車番と3連単配当は必須です。"); return;
        }

        studyDatabase.push(resultRecord);
        localStorage.setItem('keirin_study_db', JSON.stringify(studyDatabase));
        loadHistoryList();
        alert("結果を保存しました！次回からのAI学習予想に反映されます。");
    }

    // --- データのインポート/エクスポート/表示 ---
    function loadHistoryList() {
        const list = document.getElementById('historyList');
        list.innerHTML = '';
        if(studyDatabase.length === 0) { list.innerHTML = '保存された結果はありません'; return; }
        [...studyDatabase].reverse().forEach(item => {
            const div = document.createElement('div');
            div.className = 'history-item';
            div.innerHTML = `
                <div><strong>${item.venue} ${item.raceNum}R</strong> 結果: ${item.firstCar}-${item.secondCar} (${item.firstTech}-${item.secondTech})<br>
                <span style="color:var(--accent-orange);">3連単: ${parseInt(item.payout3 || 0).toLocaleString()}円</span></div>
            `;
            list.appendChild(div);
        });
    }

    function exportData() {
        if(studyDatabase.length === 0) return alert("保存するデータがありません。");
        const blob = new Blob([JSON.stringify(studyDatabase, null, 2)], {type: 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `keirin_study_data.json`;
        a.click();
    }

    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const rawData = JSON.parse(e.target.result);
                let count = 0;
                rawData.forEach(item => {
                    if (item.order && item.tech1) {
                        const cars = item.order.split('-');
                        if (cars.length >= 2) {
                            studyDatabase.push({
                                venue: "過去データ", raceNum: item.raceNo || 0,
                                firstCar: cars[0], firstTech: item.tech1 === "逃" ? "逃げ" : item.tech1 === "差" ? "差し" : item.tech1 === "捲" ? "捲り" : item.tech1 === "マ" ? "マーク" : item.tech1,
                                secondCar: cars[1], secondTech: item.tech2 || "",
                                payout2: item.payout2 || 0, payout3: item.payout3 || 0
                            });
                            count++;
                        }
                    } else if (item.firstCar) { studyDatabase.push(item); count++; }
                });
                localStorage.setItem('keirin_study_db', JSON.stringify(studyDatabase));
                loadHistoryList();
                alert(`📂 ${count}件のデータを統合しました。`);
            } catch(err) { alert("ファイルの読み込みに失敗しました。"); }
        };
        reader.readAsText(file);
    }

    function clearData() {
        if(confirm("すべての結果履歴をリセットしますか？")) {
            studyDatabase = []; localStorage.removeItem('keirin_study_db'); initSystem();
        }
    }

    window.onload = initSystem;
</script>
</body>
</html>

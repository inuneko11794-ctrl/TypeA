<!DOCTYPE html>
<html lang="ja" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BATTLE BANK-KUN | HYPER LIGHT CYBER MATRIX</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-cyan: 0, 150, 255;
      --color-magenta: 255, 0, 110;
      --color-light-bg: 240, 244, 250;
      --color-alert: 239, 68, 68;
    }
    body {
      background-color: #f0f4fa;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(0, 150, 255, 0.08), transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(255, 0, 110, 0.06), transparent 40%),
        linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
      font-family: 'Noto Sans JP', sans-serif;
      color: #1e293b;
      overflow-x: hidden;
      animation: light-flicker 4s infinite;
    }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    .font-mono-tech { font-family: 'Share Tech Mono', monospace; }
    
    @keyframes light-flicker {
      0%, 95%, 97%, 100% { background-color: #f0f4fa; }
      96%, 98% { background-color: #e2e8f0; }
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 150, 255, 0.3);
      box-shadow: 0 10px 30px -5px rgba(0, 100, 255, 0.15), inset 0 0 15px rgba(255, 255, 255, 0.8);
      position: relative;
      overflow: hidden;
      animation: border-light-pulse 3s infinite alternate;
    }
    @keyframes border-light-pulse {
      0% { border-color: rgba(0, 150, 255, 0.3); box-shadow: 0 10px 30px -5px rgba(0, 100, 255, 0.1), inset 0 0 15px rgba(255, 255, 255, 0.8); }
      100% { border-color: rgba(255, 0, 110, 0.6); box-shadow: 0 15px 35px -5px rgba(255, 0, 110, 0.25), inset 0 0 25px rgba(255, 255, 255, 1); }
    }

    .glass-panel::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, rgba(0,150,255,0.8), rgba(255,0,110,0.8));
    }
    
    .neon-text-cyan { 
      color: #0284c7;
      text-shadow: 0 0 10px rgba(0, 150, 255, 0.4), 0 0 20px rgba(0, 150, 255, 0.2);
    }
    .neon-text-magenta { 
      color: #db2777;
      text-shadow: 0 0 10px rgba(255, 0, 110, 0.4), 0 0 20px rgba(255, 0, 110, 0.2);
    }

    .glitch { position: relative; }
    .glitch::before, .glitch::after {
      content: attr(data-text); position: absolute; top: 0; left: 0; opacity: 0.8;
    }
    .glitch::before {
      left: 2px; color: #00f0ff; animation: glitch-anim-1 2s infinite linear alternate-reverse;
    }
    .glitch::after {
      left: -2px; color: #ff007f; animation: glitch-anim-2 3s infinite linear alternate-reverse;
    }
    @keyframes glitch-anim-1 {
      0% { clip-path: inset(20% 0 80% 0); }
      20% { clip-path: inset(60% 0 10% 0); }
      40% { clip-path: inset(40% 0 50% 0); }
      60% { clip-path: inset(80% 0 5% 0); }
      80% { clip-path: inset(10% 0 70% 0); }
      100% { clip-path: inset(30% 0 20% 0); }
    }
    @keyframes glitch-anim-2 {
      0% { clip-path: inset(10% 0 60% 0); }
      20% { clip-path: inset(30% 0 20% 0); }
      40% { clip-path: inset(70% 0 10% 0); }
      60% { clip-path: inset(20% 0 50% 0); }
      80% { clip-path: inset(50% 0 30% 0); }
      100% { clip-path: inset(5% 0 80% 0); }
    }

    .blink-fast { animation: blink-fast 0.15s infinite; }
    @keyframes blink-fast { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    
    .btn-cyber {
      background: linear-gradient(135deg, rgba(0,150,255,0.1), rgba(0,150,255,0.2)); 
      border: 1px solid rgba(0,150,255,0.6);
      color: #0284c7; transition: all 0.2s; position: relative; overflow: hidden; letter-spacing: 2px;
      font-weight: bold;
    }
    .btn-cyber:hover {
      background: linear-gradient(135deg, rgba(0,150,255,0.8), rgba(0,100,220,0.9)); 
      box-shadow: 0 0 20px rgba(0,150,255,0.6); color: #fff;
    }
    .btn-alert {
      background: linear-gradient(135deg, rgba(239,68,68,0.1), rgba(255,0,110,0.2)); 
      border: 1px solid rgba(239,68,68,0.6);
      color: #dc2626; font-weight: bold;
      animation: alert-light-pulse 1s infinite alternate;
    }
    .btn-alert:hover {
      background: linear-gradient(135deg, rgba(239,68,68,0.9), rgba(255,0,110,0.9)); 
      box-shadow: 0 0 20px rgba(239,68,68,0.8); color: #fff;
    }
    @keyframes alert-light-pulse {
      0% { box-shadow: 0 0 5px rgba(239,68,68,0.2); }
      100% { box-shadow: 0 0 15px rgba(239,68,68,0.6); }
    }

    .card-matrix { 
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(0, 150, 255, 0.2); 
      transition: all 0.3s; 
    }
    .card-matrix:hover {
      border-color: rgba(255, 0, 110, 0.8);
      box-shadow: 0 10px 25px -5px rgba(255, 0, 110, 0.25);
      transform: translateY(-3px) scale(1.02);
    }
    
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); }
    ::-webkit-scrollbar-thumb { background: rgba(0,150,255,0.5); border-radius: 4px; }
    
    .scanline {
      width: 100%; height: 20vh; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(0,150,255,0.15) 50%, rgba(255,255,255,0));
      opacity: 0.5; position: fixed; top: -20vh; left: 0; animation: scanline 4s linear infinite; pointer-events: none; z-index: 9999;
    }
    @keyframes scanline { 0% { top: -20vh; } 100% { top: 120vh; } }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-3 md:p-6 relative">
  <div class="scanline"></div>

  <!-- Main Container -->
  <div class="w-full max-w-7xl relative z-10">
    
    <!-- Header -->
    <header class="flex flex-col md:flex-row justify-between items-end border-b-2 border-sky-400/60 pb-4 mb-6 relative">
      <div class="absolute bottom-0 left-0 w-1/3 h-1 bg-gradient-to-r from-sky-400 to-pink-500 shadow-[0_0_12px_#0ea5e9]"></div>
      <div>
        <h1 class="font-orbitron text-4xl md:text-5xl font-black tracking-widest text-slate-900 neon-text-cyan flex items-center gap-3 glitch hover-snd" data-text="BATTLE BANK-KUN">
          BATTLE BANK-KUN
        </h1>
        <div class="flex items-center gap-3 mt-2">
          <span class="text-xs font-bold tracking-widest bg-sky-100 border border-sky-400 text-sky-700 px-3 py-1.5 rounded-full shadow-sm animate-pulse">HYPER LIGHT MATRIX v5.1</span>
          <!-- Audio Toggle Button directly clickable -->
          <button id="audioToggleBtn" onclick="toggleAudioSystem()" class="text-[10px] text-slate-700 hover:text-sky-600 border border-slate-300 bg-white/90 hover:border-sky-400 px-3 py-1 rounded-full flex items-center gap-1.5 shadow-sm transition cursor-pointer hover-snd click-snd">
            <div id="audioStatus" class="w-2 h-2 rounded-full bg-red-500"></div>
            <span>AUDIO_SYS [OFF]</span>
          </button>
        </div>
      </div>
      <div id="dataCount" class="font-mono-tech text-xl text-sky-700 border border-sky-400 bg-sky-50/80 px-6 py-2.5 mt-4 md:mt-0 rounded-xl shadow-[0_0_20px_rgba(14,165,233,0.2)] flex items-center gap-3 hover-snd">
        <span class="text-xs text-sky-600 font-bold">DB.RECORDS</span>
        <span class="font-bold tracking-widest text-sky-900">[ 00000 ]</span>
      </div>
    </header>

    <!-- Dashboard Grid -->
    <div class="grid grid-cols-1 xl:grid-cols-12 gap-6 mb-6">
      
      <!-- Control Terminal (Left Column) -->
      <div class="xl:col-span-4 flex flex-col gap-5">
        <div class="glass-panel p-5 rounded-2xl">
          <div class="flex justify-between items-center mb-3">
            <h2 class="font-bold text-xs tracking-widest text-sky-700 border-l-4 border-sky-500 pl-2">▶ DATA UPLINK // データ受信</h2>
            <button onclick="document.getElementById('mdFileInput').click()" class="text-[10px] font-bold text-slate-700 hover:text-sky-600 transition flex items-center gap-1.5 bg-white px-3.5 py-1.5 rounded-lg border border-slate-300 hover:border-sky-400 hover:shadow-[0_0_10px_rgba(14,165,233,0.3)] hover-snd click-snd">
              📄 FILE UPLOAD
            </button>
            <input type="file" id="mdFileInput" class="hidden" accept=".md,.txt" onchange="loadMarkdown(event)">
          </div>
          
          <textarea id="dataInput" rows="7" class="w-full p-3.5 bg-white/90 border border-sky-200 text-slate-800 rounded-xl focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-400/30 font-mono-tech text-xs placeholder-slate-400 resize-none transition shadow-inner hover-snd" placeholder="> Awaiting raw data sequence...&#10;> 出走表・結果テキストをここにペーストして解析を開始してください。"></textarea>
          
          <div class="flex flex-col gap-3 mt-4">
            <button onclick="triggerExtract()" class="btn-cyber font-bold py-3.5 rounded-xl text-xs flex justify-center items-center gap-2 hover-snd click-snd shadow-md">
              📥 EXTRACT & ARCHIVE [データ抽出保存]
            </button>
            <button onclick="triggerSync()" class="btn-alert font-bold py-3.5 rounded-xl text-xs flex justify-center items-center gap-2 hover-snd click-snd shadow-md">
              <span class="blink-fast">⚠️</span> SYNC PAYOUT [配当金同期プロセス]
            </button>
          </div>
        </div>

        <div class="glass-panel p-5 rounded-2xl">
          <h2 class="font-bold text-xs tracking-widest text-sky-700 border-l-4 border-sky-500 pl-2 mb-4">▶ SYS.COMMANDS // 制御</h2>
          <div class="grid grid-cols-3 gap-2 mb-4">
            <button onclick="showPayoutEditor()" class="bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 hover:border-sky-500 font-bold py-2.5 rounded-xl text-[9px] transition uppercase tracking-widest hover-snd click-snd shadow-sm">
              手動修正
            </button>
            <button onclick="runAnalysis()" class="bg-sky-50 hover:bg-sky-100 text-sky-700 border border-sky-300 hover:border-sky-500 font-bold py-2.5 rounded-xl text-[9px] transition uppercase tracking-widest shadow-[0_0_10px_rgba(14,165,233,0.15)] hover-snd click-snd">
              UI再構築
            </button>
            <button onclick="deepScan7Car()" class="bg-pink-50 hover:bg-pink-100 text-pink-700 border border-pink-300 hover:border-pink-500 font-bold py-2.5 rounded-xl text-[9px] transition uppercase tracking-widest shadow-[0_0_10px_rgba(236,72,153,0.2)] hover-snd click-snd">
              7車 DEEP SCAN
            </button>
          </div>
          <div class="grid grid-cols-3 gap-2 border-t border-slate-200 pt-4">
            <button onclick="exportData()" class="bg-white border border-slate-200 hover:border-sky-400 hover:text-sky-600 text-slate-500 py-2 rounded-lg text-[9px] uppercase tracking-wider transition hover-snd click-snd shadow-sm">データ書出</button>
            <button onclick="document.getElementById('fileInput').click()" class="bg-white border border-slate-200 hover:border-sky-400 hover:text-sky-600 text-slate-500 py-2 rounded-lg text-[9px] uppercase tracking-wider transition hover-snd click-snd shadow-sm">データ読込</button>
            <input type="file" id="fileInput" class="hidden" accept=".json" onchange="importData(event)">
            <button onclick="clearData()" class="bg-white border border-red-200 hover:border-red-500 hover:text-red-600 text-red-500 py-2 rounded-lg text-[9px] uppercase tracking-wider transition hover-snd click-snd shadow-sm">完全消去</button>
          </div>
        </div>
      </div>

      <!-- Main Visual Analytics (Right Column) -->
      <div class="xl:col-span-8 flex flex-col gap-6">
        
        <!-- Graph Area -->
        <div class="glass-panel p-5 rounded-2xl flex-grow flex flex-col">
          <h2 class="font-bold text-xs tracking-widest text-slate-900 border-l-4 border-pink-500 pl-2 mb-3 flex justify-between items-center">
            <span class="neon-text-magenta">▶ KINETIC VISUALIZER // 動的解析グラフ</span>
            <div class="flex items-center gap-2 bg-white/80 px-2.5 py-1 rounded-full border border-slate-200 shadow-sm">
              <span class="w-2 h-2 rounded-full bg-red-500 blink-fast"></span>
              <span class="text-[10px] text-red-600 tracking-widest font-mono-tech font-bold">REC</span>
            </div>
          </h2>
          <div class="flex-grow w-full bg-white/80 rounded-xl border border-sky-100 p-3 relative shadow-inner" style="min-height: 250px;">
            <canvas id="matrixChart"></canvas>
          </div>
        </div>

        <!-- Terminal Output -->
        <div class="glass-panel p-5 rounded-2xl h-48 flex flex-col relative">
          <h2 class="font-bold text-[10px] tracking-widest text-sky-700 border-l-4 border-sky-800 pl-2 mb-2">▶ TERMINAL LOG // 実行履歴</h2>
          <button onclick="document.getElementById('outputArea').innerHTML=''" class="absolute top-4 right-4 text-[9px] text-slate-500 hover:text-sky-600 border border-slate-200 hover:border-sky-400 bg-white px-2.5 py-1 rounded-lg transition hover-snd click-snd shadow-sm">CLEAR</button>
          <div id="outputArea" class="flex-grow bg-slate-900 text-sky-400 rounded-xl border border-sky-900/40 p-3.5 overflow-y-auto font-mono-tech text-[11px] leading-relaxed whitespace-pre-wrap shadow-inner custom-scrollbar">SYSTEM BOOT SEQUENCE INITIATED...
AWAITING COMMAND EXECUTION...</div>
        </div>
      </div>
    </div>

    <!-- Stats Cards Grid -->
    <h2 class="font-bold text-xs tracking-widest text-sky-700 border-l-4 border-sky-500 pl-2 mb-4">▶ CATEGORY METRICS & ROI (回収率)</h2>
    <div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-6 gap-4" id="categoryCards">
      <!-- Generated via JS -->
    </div>

  </div>

  <script>
    let savedRecords = [];
    let myChart = null;

    /* --- AUDIO FX SYSTEM (FIXED & CLICKABLE) --- */
    let audioCtx = null;
    let audioUnlocked = false;

    function toggleAudioSystem() {
        if (!audioUnlocked) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            audioCtx.resume().then(() => {
                audioUnlocked = true;
                document.getElementById('audioStatus').classList.replace('bg-red-500', 'bg-sky-500');
                document.getElementById('audioStatus').classList.add('shadow-[0_0_10px_#0ea5e9]');
                document.getElementById('audioToggleBtn').innerHTML = '<div id="audioStatus" class="w-2 h-2 rounded-full bg-sky-500 shadow-[0_0_10px_#0ea5e9]"></div><span>AUDIO_SYS [ON]</span>';
                playBeep(880, 'sine', 0.1, 0.03);
                logToTerminal("> オーディオシステムが手動有効化されました。", "success");
            });
        } else {
            audioUnlocked = false;
            document.getElementById('audioStatus').classList.replace('bg-sky-500', 'bg-red-500');
            document.getElementById('audioStatus').classList.remove('shadow-[0_0_10px_#0ea5e9]');
            document.getElementById('audioToggleBtn').innerHTML = '<div id="audioStatus" class="w-2 h-2 rounded-full bg-red-500"></div><span>AUDIO_SYS [OFF]</span>';
            logToTerminal("> オーディオシステムがミュートされました。", "info");
        }
    }

    function playBeep(freq, type, duration, vol=0.03) {
        if(!audioUnlocked || !audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch(e) { console.log(e); }
    }
    
    function sndHover() { playBeep(700, 'sine', 0.04, 0.01); }
    function sndClick() { playBeep(1400, 'square', 0.08, 0.02); }
    function sndProcess() { playBeep(200, 'sawtooth', 0.15, 0.04); }
    function sndSuccess() { 
        playBeep(880, 'sine', 0.08, 0.03);
        setTimeout(() => playBeep(1320, 'sine', 0.15, 0.03), 80);
    }
    function sndError() { 
        playBeep(220, 'sawtooth', 0.1, 0.04);
        setTimeout(() => playBeep(160, 'sawtooth', 0.2, 0.04), 80);
    }

    document.addEventListener('mouseover', (e) => { if(e.target.closest('.hover-snd')) sndHover(); });
    document.addEventListener('click', (e) => { if(e.target.closest('.click-snd')) sndClick(); });

    window.onload = () => {
      const stored = localStorage.getItem('battleBankProData');
      if (stored) {
        savedRecords = JSON.parse(stored);
        updateCountDisplay();
        runAnalysis();
        logToTerminal("> DBリカバリ完了. ハイパーライトシステム稼働中.");
      } else {
        runAnalysis(); 
      }
    };
    
    function logToTerminal(msg, type="info") {
        const out = document.getElementById('outputArea');
        const time = new Date().toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute:'2-digit', second:'2-digit' });
        let color = "text-sky-300";
        if(type === "error") color = "text-red-400";
        if(type === "success") color = "text-pink-400";
        
        const line = `<span class="text-slate-500">[${time}]</span> <span class="${color}">${msg}</span><br>`;
        out.innerHTML = line + out.innerHTML;
    }
    function logToTerminalRaw(htmlStr) {
        const out = document.getElementById('outputArea');
        out.innerHTML = htmlStr + out.innerHTML;
    }

    function loadMarkdown(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('dataInput').value = e.target.result;
        document.getElementById('mdFileInput').value = ''; 
        logToTerminal("> ファイルをメモリに展開. 抽出プロセス待機中...");
      };
      reader.readAsText(file);
    }

    function triggerExtract() {
        if (!document.getElementById('dataInput').value.trim()) {
            logToTerminal("> エラー: データが入力されていません.", "error"); sndError(); return;
        }
        runWithProgress("INITIATING EXTRACTION PROTOCOL...", extractAndSaveData);
    }
    
    function triggerSync() {
        if (!document.getElementById('dataInput').value.trim()) {
            logToTerminal("> エラー: バッファに結果データが存在しません.", "error"); sndError(); return;
        }
        runWithProgress("SYNCING PAYOUT DATABASES...", applyResults);
    }

    function runWithProgress(taskName, callback) {
        sndProcess();
        const progressId = 'prog_' + Date.now();
        const time = new Date().toLocaleTimeString('en-US', { hour12: false });
        const logMsg = `<span class="text-slate-500">[${time}]</span> <span class="text-sky-300">> ${taskName}</span><br><span id="${progressId}" class="text-pink-400 font-bold"></span><br>`;
        logToTerminalRaw(logMsg);
        
        let progress = 0;
        const el = document.getElementById(progressId);
        const interval = setInterval(() => {
            progress += Math.floor(Math.random() * 25) + 10;
            if(progress > 100) progress = 100;
            const filled = Math.floor(progress / 5); 
            if(el) el.innerHTML = `[${'='.repeat(filled)}${'_'.repeat(20-filled)}] ${progress}%`;
            if(Math.random() > 0.5) sndHover();

            if(progress === 100) {
                clearInterval(interval);
                setTimeout(() => {
                    callback();
                    sndSuccess();
                }, 300);
            }
        }, 80);
    }

    function extractAndSaveData() {
      const inputData = document.getElementById('dataInput').value;
      let extractedCount = 0;
      const blocks = inputData.split(/(?=競輪レースデータ|レース名|第?\d+R)/);
      
      blocks.forEach(block => {
          if(!block.trim()) return;
          let venue = "UNKNOWN"; 
          let raceName = "UNKNOWN";
          
          const fullLineMatch = block.match(/(?:競輪レースデータ[：:]\s*)?([^\s#\n]+(?:競輪|[場市区町村])?[^\s#\n]*?\d+R)/);
          if (fullLineMatch) {
              const rawFull = fullLineMatch[1].replace(/競輪レースデータ[：:]/g, '').trim();
              raceName = rawFull.match(/\d+R/)?.[0] || "UNKNOWN";
              venue = rawFull.replace(raceName, '').replace(/競輪/g, '').trim();
              if(!venue) venue = "UNKNOWN";
          } else {
              const raceMatch = block.match(/(\d+R)/);
              if (raceMatch) raceName = raceMatch[1];
              
              const venueKeywords = block.match(/([^\s#\n]{2,4})(?=競輪|\s+\d+R)/);
              if (venueKeywords) venue = venueKeywords[1].replace(/競輪/g, '');
          }

          const hasGirlsKeyword = block.includes("ガールズ") || block.includes("L級");
          const comments = block.match(/- \*\*\[\d+\]\s*.*?\*\*：(.*?)(?=\n|$)/g);
          let tankiCount = 0; let totalCommentCount = 0;
          if (comments) {
              totalCommentCount = comments.length;
              comments.forEach(c => { if (c.includes("単騎") || c.includes("自力") || c.includes("自在")) { if(c.includes("単騎")) tankiCount++; } });
          }
          let isGirls = false;
          if (hasGirlsKeyword && (totalCommentCount > 0 && tankiCount === totalCommentCount)) isGirls = true;
          else if (hasGirlsKeyword && totalCommentCount === 0) isGirls = true;

          let category = "9車";
          if (isGirls) { category = "ガールズ"; } else {
              const allCarRows = block.match(/\| \d+ \|/g);
              if (allCarRows) {
                  const carCount = allCarRows.length;
                  if (carCount >= 5 && carCount <= 9) category = carCount + "車";
              } else {
                  const matchCars = block.match(/\[([\d\s]+)\]/g);
                  if (matchCars) {
                      let maxCarNum = 0;
                      matchCars.forEach(m => {
                          const nums = m.replace(/[\[\]]/g, '').trim().split(/\s+/).map(Number);
                          nums.forEach(n => { if(n > maxCarNum) maxCarNum = n; });
                      });
                      if (maxCarNum >= 5 && maxCarNum <= 9) category = maxCarNum + "車";
                  }
              }
          }
          let patternKey = null; let diffPatternKey = null; let diffDisplay = null;
          const allLineMatches = block.match(/\[([\d\s]+)\]/g);
          let allDiffs = []; let diffLogArr = [];
          if (allLineMatches) {
              allLineMatches.forEach((lm, index) => {
                  const carsArr = lm.replace(/[\[\]]/g, '').trim().split(/\s+/).map(Number);
                  if (index === 0 && carsArr.length > 1) patternKey = carsArr.join('-');
                  if (carsArr.length > 1) {
                      let localDiffs = [];
                      for (let i = 0; i < carsArr.length - 1; i++) localDiffs.push(Math.abs(carsArr[i] - carsArr[i+1]));
                      let sum = localDiffs.reduce((a, b) => a + b, 0);
                      if (sum === 4) { allDiffs.push(4); diffLogArr.push("4(合算)"); } else {
                          allDiffs.push(...localDiffs); diffLogArr.push(localDiffs.join('-'));
                      }
                  }
              });
              if (allDiffs.length > 0) { diffPatternKey = allDiffs.join('-'); diffDisplay = diffLogArr.join(' / '); }
          }
          if (patternKey || diffPatternKey) {
              const exists = savedRecords.find(r => r.venue === venue && r.raceName === raceName && r.pattern === patternKey);
              if (!exists) {
                  savedRecords.push({ venue, raceName, category, pattern: patternKey, diffPattern: diffPatternKey, diffDisplay, payout: 0, timestamp: new Date().getTime() });
                  extractedCount++;
              }
          }
      });
      if (extractedCount > 0) {
        localStorage.setItem('battleBankProData', JSON.stringify(savedRecords));
        document.getElementById('dataInput').value = '';
        updateCountDisplay(); runAnalysis();
        logToTerminal(`> 完了. 計 ${extractedCount} レースをDBに格納.`, "success");
      } else { logToTerminal("> 警告: 解析可能なデータが見つかりません.", "error"); }
    }

    function applyResults() {
        const text = document.getElementById('dataInput').value;
        let updatedCount = 0;
        savedRecords.forEach(record => {
            if (record.raceName && record.payout === 0) {
                const raceIdx = text.indexOf(record.raceName);
                if (raceIdx !== -1) {
                    const searchArea = text.substring(raceIdx, raceIdx + 300);
                    const payoutMatch = searchArea.match(/3連単.*?(\d{1,3}(?:,\d{3})*|\d+)\s*円/);
                    if (payoutMatch) {
                        const money = parseInt(payoutMatch[1].replace(/,/g, ''), 10);
                        if (money > 0) { record.payout = money; updatedCount++; }
                    } else {
                        const genericMatch = searchArea.match(/配当.*?(\d{1,3}(?:,\d{3})*|\d+)円/);
                        if (genericMatch) { record.payout = parseInt(genericMatch[1].replace(/,/g, ''), 10); updatedCount++; }
                    }
                }
            }
        });
        if (updatedCount > 0) {
            localStorage.setItem('battleBankProData', JSON.stringify(savedRecords));
            document.getElementById('dataInput').value = '';
            updateCountDisplay(); runAnalysis();
            logToTerminal(`> 同期完了. ${updatedCount} 件の配当情報を更新.`, "success");
        } else { logToTerminal("> 警告: マッチする未入力レース・配当が見つかりません.", "error"); }
    }

    function deepScan7Car() {
        const data7 = savedRecords.filter(r => r.category === "7車");
        if(data7.length === 0) {
            logToTerminal("> エラー: 7車立てのデータが存在しません.", "error"); sndError(); return;
        }
        
        const synced = data7.filter(r => r.payout > 0);
        const pts = 10;
        const costPerRace = pts * 100;
        const totalInv = synced.length * costPerRace;
        const totalRet = synced.reduce((sum, r) => sum + r.payout, 0);
        const roi = totalInv > 0 ? ((totalRet / totalInv) * 100).toFixed(1) : 0;
        const max = synced.length > 0 ? Math.max(...synced.map(r=>r.payout)) : 0;

        const patterns = {};
        synced.forEach(r => {
            if(r.diffPattern) patterns[r.diffPattern] = (patterns[r.diffPattern] || 0) + 1;
        });
        const topPatterns = Object.entries(patterns).sort((a,b)=>b[1]-a[1]).slice(0,3);

        let log = `<br><span class="text-pink-600 font-bold tracking-widest">--- [ 7-CAR DEEP SCAN RESULTS ] ---</span><br>`;
        log += `<span class="text-sky-700">対象レース数:</span> ${data7.length}件 (同期済: ${synced.length}件)<br>`;
        log += `<span class="text-sky-700">想定投資額　:</span> ¥${totalInv.toLocaleString()} <span class="text-slate-500">(1R ${pts}点換算)</span><br>`;
        log += `<span class="text-sky-700">回収総額　　:</span> ¥${totalRet.toLocaleString()}<br>`;
        log += `<span class="text-sky-700">回収率(ROI) :</span> <span class="${roi>=100 ? 'text-emerald-600':'text-red-600'} font-bold">${roi}%</span><br>`;
        log += `<span class="text-sky-700">最高配当額　:</span> ¥${max.toLocaleString()}<br>`;
        log += `<span class="text-sky-700">頻出ライン構成 (diffPattern TOP 3):</span><br>`;
        if(topPatterns.length > 0) {
            topPatterns.forEach((p, i) => { log += `  0${i+1}. [ ${p[0]} ] : ${p[1]} 回発生<br>`; });
        } else { log += `  データ不足<br>`; }
        log += `<span class="text-pink-600 tracking-widest">-----------------------------------</span><br>`;
        
        logToTerminalRaw(log);
    }

    function runAnalysis() {
      const categories = ["5車", "6車", "7車", "8車", "9車", "ガールズ"];
      const catStats = {};
      categories.forEach(c => { catStats[c] = { count: 0, payouts: [] }; });

      if (savedRecords.length > 0) {
          savedRecords.forEach(record => {
            let cat = record.category || "9車";
            if (!catStats[cat]) catStats[cat] = { count: 0, payouts: [] };
            catStats[cat].count++;
            if (record.payout > 0) catStats[cat].payouts.push(record.payout);
          });
      }

      let cardsHtml = ''; let chartLabels = categories; let chartCounts = []; let chartAvgs = [];

      categories.forEach(c => {
        const data = catStats[c];
        const avg = data.payouts.length > 0 ? Math.round(data.payouts.reduce((a,b)=>a+b,0)/data.payouts.length) : 0;
        const max = data.payouts.length > 0 ? Math.max(...data.payouts) : 0;
        
        const totalInv = data.payouts.length * 1000;
        const totalRet = data.payouts.reduce((a,b)=>a+b,0);
        const roi = totalInv > 0 ? ((totalRet / totalInv) * 100).toFixed(1) : 0;
        const roiColor = roi >= 100 ? "text-emerald-600 font-bold" : "text-red-600 font-bold";
        
        chartCounts.push(data.count); chartAvgs.push(avg);

        cardsHtml += `
          <div class="card-matrix bg-white/95 backdrop-blur-md p-4 rounded-2xl flex flex-col justify-between relative overflow-hidden group shadow-md">
            <div class="absolute top-0 right-0 w-24 h-24 bg-gradient-to-br from-sky-100 to-transparent rounded-bl-full pointer-events-none group-hover:from-pink-100 transition"></div>
            
            <div class="mb-3 flex justify-between items-start">
              <div>
                <div class="font-mono-tech text-[9px] text-sky-600 tracking-widest mb-0.5 uppercase border-b border-sky-100 pb-0.5">TARGET CLASS</div>
                <div class="font-bold text-lg text-slate-800 group-hover:text-sky-600 transition tracking-wider">${c}</div>
              </div>
              <div class="text-right">
                <div class="text-[8px] text-slate-400 tracking-widest uppercase">ROI</div>
                <div class="font-mono-tech text-xs ${roiColor}">${roi}%</div>
              </div>
            </div>
            
            <div class="grid grid-cols-2 gap-2 mb-3">
              <div class="bg-sky-50/70 border border-sky-100 rounded-xl p-1.5 text-center">
                <div class="text-[7px] text-slate-400 uppercase tracking-widest">Logged</div>
                <div class="font-mono-tech text-sky-700 text-xs font-bold">${data.count}</div>
              </div>
              <div class="bg-pink-50/70 border border-pink-100 rounded-xl p-1.5 text-center">
                <div class="text-[7px] text-slate-400 uppercase tracking-widest">Synced</div>
                <div class="font-mono-tech text-pink-600 text-xs font-bold">${data.payouts.length}</div>
              </div>
            </div>
            
            <div class="mt-1 pt-2 border-t border-slate-100">
              <div class="text-[8px] text-slate-400 uppercase tracking-widest mb-1 flex justify-between">
                <span>Avg Return</span>
                <span>Max</span>
              </div>
              <div class="flex justify-between items-end">
                <div class="font-mono-tech font-bold text-sm text-slate-800">${avg > 0 ? '¥' + avg.toLocaleString() : '---'}</div>
                <div class="font-mono-tech text-[9px] text-slate-500">${max > 0 ? '¥' + max.toLocaleString() : '-'}</div>
              </div>
            </div>
          </div>
        `;
      });
      document.getElementById('categoryCards').innerHTML = cardsHtml;

      const canvas = document.getElementById('matrixChart'); const ctx = canvas.getContext('2d');
      const barGrad = ctx.createLinearGradient(0, 0, 0, 300); barGrad.addColorStop(0, 'rgba(14, 165, 233, 0.85)'); barGrad.addColorStop(1, 'rgba(14, 165, 233, 0.2)');
      const lineGrad = ctx.createLinearGradient(0, 0, 0, 300); lineGrad.addColorStop(0, 'rgba(236, 72, 153, 0.45)'); lineGrad.addColorStop(1, 'rgba(236, 72, 153, 0.0)');
      if (myChart) myChart.destroy();
      myChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: chartLabels,
          datasets: [
            { label: ' LOGGED RACES (件数)', data: chartCounts, backgroundColor: barGrad, borderColor: '#0ea5e9', borderWidth: 1.5, yAxisID: 'y', borderRadius: 4, barPercentage: 0.6, order: 2 },
            { label: ' AVG PAYOUT (平均払戻)', data: chartAvgs, type: 'line', borderColor: '#ec4899', backgroundColor: lineGrad, borderWidth: 2.5, fill: true, pointBackgroundColor: '#fff', pointBorderColor: '#ec4899', pointBorderWidth: 2, pointRadius: 4.5, pointHoverRadius: 7, pointHoverBackgroundColor: '#0ea5e9', pointHoverBorderColor: '#fff', yAxisID: 'y1', tension: 0.2, order: 1 }
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
          scales: {
            x: { grid: { color: 'rgba(0, 0, 0, 0.04)', drawBorder: false }, ticks: { color: '#475569', font: { family: "'Noto Sans JP', sans-serif", size: 10, weight: 'bold' } } },
            y: { type: 'linear', position: 'left', grid: { color: 'rgba(0, 0, 0, 0.04)', drawBorder: false }, ticks: { color: '#0ea5e9', font: { family: "'Share Tech Mono', monospace", size: 11 } } },
            y1: { type: 'linear', position: 'right', grid: { display: false }, ticks: { color: '#ec4899', font: { family: "'Share Tech Mono', monospace", size: 11 } } }
          },
          plugins: {
            legend: { position: 'top', align: 'end', labels: { color: '#1e293b', font: { family: "'Orbitron', sans-serif", size: 10, weight: 'bold' }, boxWidth: 10, boxHeight: 10, usePointStyle: true } },
            tooltip: {
              backgroundColor: 'rgba(255, 255, 255, 0.95)', titleColor: '#1e293b', titleFont: { family: "'Noto Sans JP', sans-serif", size: 12, weight: 'bold' }, bodyColor: '#475569', bodyFont: { family: "'Share Tech Mono', monospace" }, borderColor: '#0ea5e9', borderWidth: 1, padding: 12, displayColors: true,
              callbacks: { label: function(context) { let label = context.dataset.label || ''; if (context.datasetIndex === 1) return label + ' : ¥' + context.parsed.y.toLocaleString(); else return label + ' : ' + context.parsed.y + ' 件'; } }
            }
          }
        }
      });
    }

    function showPayoutEditor() {
      if (savedRecords.length === 0) { logToTerminal("> エラー: 編集するレコードが存在しません.", "error"); sndError(); return; }
      let html = '<div class="space-y-1.5 max-h-32 overflow-y-auto pr-2 custom-scrollbar">';
      [...savedRecords].reverse().forEach((record, revIndex) => {
        const originalIndex = savedRecords.length - 1 - revIndex;
        const color = record.payout > 0 ? 'border-l-pink-500 bg-pink-50/50' : 'border-l-sky-500 bg-sky-50/50';
        const venueText = (record.venue && record.venue !== "UNKNOWN") ? record.venue : "";
        html += `
          <div class="flex items-center justify-between p-2.5 rounded-xl border-l-4 ${color} border border-slate-200 text-xs hover:border-sky-400 transition hover-snd bg-white shadow-sm">
            <div class="flex flex-col">
              <span class="text-slate-800 font-bold tracking-wide">[${record.category || '9車'}] ${venueText} ${record.raceName || ''}</span>
              <span class="text-sky-600 text-[9px] font-mono-tech">DIFF_SEQ: ${record.diffPattern || 'N/A'}</span>
            </div>
            <div class="flex items-center gap-1">
              <span class="text-[9px] text-slate-400">¥</span>
              <input type="number" id="edit_payout_${originalIndex}" value="${record.payout > 0 ? record.payout : ''}" placeholder="0" class="w-24 p-1.5 text-right bg-slate-50 text-sky-700 rounded-lg text-xs border border-slate-300 focus:border-sky-500 focus:outline-none focus:ring-1 focus:ring-sky-400 font-mono-tech shadow-inner click-snd">
            </div>
          </div>
        `;
      });
      html += '</div>';
      html += '<button onclick="savePayouts()" class="mt-3 w-full bg-sky-600 hover:bg-sky-500 text-white border border-sky-400 py-2.5 rounded-xl text-xs font-bold tracking-widest uppercase transition hover-snd click-snd shadow-md">Overwrite DB [上書き保存]</button>';
      const out = document.getElementById('outputArea');
      out.innerHTML = html + out.innerHTML;
      logToTerminal("> 手動エディタを桁数拡大仕様で起動しました.");
    }

    function savePayouts() {
      savedRecords.forEach((record, index) => {
        const inputEl = document.getElementById(`edit_payout_${index}`);
        if (inputEl) { const val = parseInt(inputEl.value, 10); record.payout = (!isNaN(val) && val >= 0) ? val : 0; }
      });
      localStorage.setItem('battleBankProData', JSON.stringify(savedRecords));
      updateCountDisplay(); runAnalysis();
      logToTerminal("> DB更新完了. 手動オーバーライド成功.", "success");
    }

    function exportData() {
      if (savedRecords.length === 0) return;
      const dataStr = JSON.stringify(savedRecords, null, 2);
      const blob = new Blob([dataStr], { type: "application/json" });
      const url = URL.createObjectURL(blob); const a = document.createElement('a');
      a.href = url; a.download = `battleBank_pro_db.json`; a.click(); URL.revokeObjectURL(url);
      logToTerminal("> データエクスポート処理完了.");
    }

    window.importData = function(event) {
      const file = event.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            savedRecords = imported; localStorage.setItem('battleBankProData', JSON.stringify(savedRecords));
            updateCountDisplay(); runAnalysis();
            logToTerminal("> インポート成功. システムを上書きしました.", "success");
          }
        } catch (err) { logToTerminal("> エラー: 不正なJSONファイルです.", "error"); sndError(); }
        document.getElementById('fileInput').value = '';
      };
      reader.readAsText(file);
    }

    function clearData() {
      if (confirm("警告: データベースを完全に初期化します。よろしいですか？")) {
        savedRecords = []; localStorage.removeItem('battleBankProData');
        updateCountDisplay(); runAnalysis();
        logToTerminal("> DBパージ完了. システムは初期状態です.");
      }
    }

    function updateCountDisplay() {
      const el = document.getElementById('dataCount');
      if(el) {
        const countStr = savedRecords.length.toString().padStart(5, '0');
        el.innerHTML = `<span class="text-xs text-sky-600 font-bold mt-0.5 block">DB.RECORDS</span><span class="font-bold tracking-widest text-sky-900">[ ${countStr} ]</span>`;
      }
    }
  </script>
</body>
</html>

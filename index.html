<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>バトルバンクくん - 車番並び×配当分析ツール</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 p-4 font-sans leading-relaxed">
  <div class="max-w-xl mx-auto bg-white p-6 rounded-lg shadow-md">
    <h1 class="text-xl font-bold text-blue-600 mb-2">ライン① 車番並び × 配当分析</h1>
    <p class="text-sm text-gray-600 mb-4">
      先頭ライン（単騎除く）の「具体的な車番の並び」ごとに配当傾向を抽出します。
    </p>

    <textarea id="dataInput" rows="8" class="w-full p-3 border rounded-md bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm mb-4" placeholder="入力例：
福井3R: [2 5 1 3] [4] 配当: 15400
福井4R: [4 5 1] [6] [2] [3] 配当: 3200
福井5R: [7 1] [2 5] [3 4 6] 配当: 11000
福井6R: [1 5 4] [6 2] [7 3] 配当: 980
福井7R: [1 5 4] [2 6] [3 7] 配当: 1250"></textarea>

    <button onclick="analyzeData()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-md transition duration-200">
      車番の並びで配当を分析する
    </button>

    <div class="mt-6">
      <h2 class="font-bold text-gray-700 mb-2 border-b pb-1">分析結果サマリー</h2>
      <pre id="outputArea" class="bg-gray-800 text-green-400 p-4 rounded-md text-sm whitespace-pre-wrap font-mono min-h-[100px]">ここにテキスト結果が出力されます...</pre>
    </div>
  </div>

  <script>
    function analyzeData() {
      const inputData = document.getElementById('dataInput').value;
      const lines = inputData.split('\n');
      const analysisMap = {}; 

      lines.forEach(line => {
        const text = line.trim();
        if (!text) return;

        // 1. 最初に出現するブラケット [...] を先頭ライン(ライン①)として抽出
        const lineMatch = text.match(/\[([\d\s]+)\]/);
        if (!lineMatch) return;

        // 車番の配列を取得
        const carsStr = lineMatch[1].trim();
        const carsArr = carsStr.split(/\s+/);

        // 単騎（1車）はラインとみなさずスキップ
        if (carsArr.length <= 1) return;

        // 車番の並びをハイフン繋ぎのキーにする (例: "1-5-4")
        const patternKey = carsArr.join('-');

        // 2. 行の末尾付近にある数字を「配当金額」として抽出
        const payoutMatch = text.match(/(\d+)[円]?$/);
        if (!payoutMatch) return;
        
        const payout = parseInt(payoutMatch[1], 10);

        // データを記録
        if (!analysisMap[patternKey]) {
          analysisMap[patternKey] = [];
        }
        analysisMap[patternKey].push(payout);
      });

      // 3. 結果をテキスト形式で組み立てる
      let resultText = "【先頭ライン車番並び別の配当データ】\n\n";
      const keys = Object.keys(analysisMap).sort();

      if (keys.length === 0) {
        resultText += "有効なデータ（2車以上の先頭ライン＋配当額）が見つかりませんでした。";
      } else {
        keys.forEach(key => {
          const payouts = analysisMap[key];
          const totalRaces = payouts.length;
          const avgPayout = Math.round(payouts.reduce((sum, val) => sum + val, 0) / totalRaces);
          const maxPayout = Math.max(...payouts);
          const minPayout = Math.min(...payouts);

          resultText += `■ 並び [${key}]\n`;
          resultText += `・出現回数 : ${totalRaces} レース\n`;
          resultText += `・平均配当 : ${avgPayout.toLocaleString()} 円\n`;
          if (totalRaces > 1) {
            resultText += `・最高配当 : ${maxPayout.toLocaleString()} 円\n`;
            resultText += `・最低配当 : ${minPayout.toLocaleString()} 円\n`;
          }
          resultText += `\n`;
        });
      }

      document.getElementById('outputArea').innerText = resultText;
    }
  </script>
</body>
</html>
